<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对比分析 v2.0 - 七步精读预览</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    :root {
      --bg-canvas: #faf8f5;
      --bg-surface: #ffffff;
      --bg-hover: #f2efe9;
      --bg-selected: #eaf0e8;
      --text-primary: #1a1714;
      --text-secondary: #4a4540;
      --text-tertiary: #9a9590;
      --accent-primary: #2d5a3d;
      --accent-primary-hover: #1e3d28;
      --accent-gold: #c4782a;
      --accent-coral: #b5423e;
      --border-light: #e8e4df;
      --border-medium: #d5d0ca;
      --shadow-sm: 0 1px 3px rgba(26,23,20,0.04);
      --shadow-md: 0 4px 12px rgba(26,23,20,0.06);
      --shadow-lg: 0 12px 24px rgba(26,23,20,0.08);
      --font-serif: Georgia, 'Times New Roman', 'STSong', 'SimSun', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-sans); background: var(--bg-canvas); color: var(--text-primary); font-size: 14px; line-height: 1.6; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 64px; background: var(--bg-surface); border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; flex-shrink: 0; position: relative; z-index: 100; box-shadow: var(--shadow-sm); }
    .topbar-brand { display: flex; align-items: baseline; gap: 16px; }
    .topbar-brand h1 { font-family: var(--font-serif); font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .topbar-brand span { font-size: 13px; color: var(--text-tertiary); }
    .btn-synthesis { background: var(--accent-primary); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; }
    .btn-synthesis:hover:not(:disabled) { background: var(--accent-primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(45,90,61,0.25); }
    .btn-synthesis:disabled { opacity: 0.35; cursor: not-allowed; }
    .paper-strip { background: var(--bg-surface); border-bottom: 1px solid var(--border-light); padding: 20px 32px; display: flex; gap: 14px; overflow-x: auto; flex-shrink: 0; position: relative; z-index: 99; }
    .paper-chip { min-width: 220px; max-width: 300px; padding: 14px 18px; border-radius: 10px; border: 2px solid transparent; background: var(--bg-canvas); cursor: pointer; position: relative; transition: all 0.2s ease; flex-shrink: 0; }
    .paper-chip:hover { background: var(--bg-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .paper-chip.active { border-color: var(--accent-primary); background: var(--bg-selected); }
    .paper-chip-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; padding-right: 20px; }
    .paper-chip-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 5px; }
    .paper-chip-check { position: absolute; top: 10px; right: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; opacity: 0; transform: scale(0.6); transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .paper-chip.active .paper-chip-check { opacity: 1; transform: scale(1); }
    .step-strip { height: 56px; background: var(--bg-canvas); border-bottom: 1px solid var(--border-light); padding: 0 32px; display: flex; gap: 10px; overflow-x: auto; align-items: center; flex-shrink: 0; position: relative; z-index: 98; }
    .step-badge { padding: 7px 16px; border-radius: 100px; font-size: 13px; border: 1.5px solid var(--border-medium); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
    .step-badge:hover { background: var(--bg-hover); }
    .step-badge.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); font-weight: 600; box-shadow: 0 2px 8px rgba(45,90,61,0.2); }
    .action-strip { height: 52px; background: var(--bg-surface); border-bottom: 1px solid var(--border-light); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; z-index: 97; }
    .action-info { display: flex; align-items: center; gap: 20px; font-size: 13px; }
    .action-info .step-name { color: var(--text-primary); font-weight: 600; }
    .action-info .count { color: var(--text-tertiary); }
    .action-btns { display: flex; gap: 10px; }
    .btn-ghost { background: none; border: 1px solid var(--border-light); padding: 7px 14px; font-size: 12px; color: var(--text-secondary); cursor: pointer; border-radius: 6px; transition: all 0.15s ease; }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
    .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
    .content-area { flex: 1; overflow-y: auto; padding: 24px 32px 40px; }
    .dimension-card { background: var(--bg-surface); border-radius: 14px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 16px; animation: slideUp 0.5s ease-out both; transition: box-shadow 0.3s ease; }
    .dimension-card:hover { box-shadow: var(--shadow-md); }
    .dimension-card:nth-child(1) { animation-delay: 0ms; }
    .dimension-card:nth-child(2) { animation-delay: 60ms; }
    .dimension-card:nth-child(3) { animation-delay: 120ms; }
    .dimension-card:nth-child(4) { animation-delay: 180ms; }
    .dim-header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; cursor: pointer; user-select: none; transition: background 0.15s ease; }
    .dim-header:hover { background: var(--bg-hover); }
    .dim-header-left { display: flex; align-items: center; gap: 14px; }
    .dim-check { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border-medium); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; flex-shrink: 0; background: white; }
    .dim-check.checked { background: var(--accent-primary); border-color: var(--accent-primary); animation: popIn 0.2s ease; }
    .dim-check .checkmark { color: white; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.1s ease; }
    .dim-check.checked .checkmark { opacity: 1; }
    .dim-num { font-size: 12px; color: var(--text-tertiary); font-family: var(--font-mono); font-weight: 500; min-width: 28px; }
    .dim-title { font-size: 15px; font-weight: 600; }
    .dim-arrow { font-size: 11px; color: var(--text-tertiary); transition: transform 0.3s ease; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .dim-header:hover .dim-arrow { background: var(--bg-hover); }
    .dimension-card.expanded .dim-arrow { transform: rotate(90deg); }
    .dim-body { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: var(--bg-canvas); border-top: 1px solid transparent; }
    .dimension-card.expanded .dim-body { max-height: 600px; border-top-color: var(--border-light); }
    .cards-scroll { display: flex; gap: 16px; padding: 20px 24px 24px; overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; cursor: grab; }
    .cards-scroll:active { cursor: grabbing; }
    .answer-card { flex: 0 0 auto; width: 380px; min-height: 220px; max-height: 520px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-light); padding: 20px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.25s ease; }
    .answer-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-medium); }
    .answer-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); flex-shrink: 0; }
    .answer-avatar { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-primary), #3d7a52); color: white; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; box-shadow: 0 2px 6px rgba(45,90,61,0.2); }
    .answer-info { min-width: 0; }
    .answer-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .answer-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
    .answer-content { flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.8; color: var(--text-secondary); user-select: text; cursor: text; padding-right: 4px; }
    .md-content p { margin: 8px 0; line-height: 1.8; }
    .md-content h1, .md-content h2, .md-content h3 { font-size: 14px; font-weight: 700; margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
    .md-content h4, .md-content h5, .md-content h6 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 10px 0 6px; }
    .md-content strong { font-weight: 700; color: var(--text-primary); }
    .md-content blockquote { margin: 12px 0; padding: 12px 16px; border-left: 3px solid var(--accent-gold); background: rgba(196,120,42,0.04); border-radius: 0 8px 8px 0; color: var(--text-secondary); font-size: 12.5px; }
    .md-content ul, .md-content ol { margin: 8px 0; padding-left: 22px; }
    .md-content li { margin: 5px 0; }
    .md-content li::marker { color: var(--accent-primary); font-weight: 600; }
    .md-content table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; line-height: 1.5; margin: 12px 0; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; }
    .md-content thead { background: var(--bg-hover); }
    .md-content th { padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border-medium); white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .md-content td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); vertical-align: top; }
    .md-content tbody tr:nth-child(even) { background: rgba(0,0,0,0.012); }
    .md-content code { background: var(--bg-hover); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; color: var(--accent-coral); font-weight: 500; }
    .md-content pre { background: #24201c; color: #e8e4df; padding: 16px; border-radius: 10px; overflow-x: auto; font-size: 12px; line-height: 1.6; margin: 12px 0; }
    .md-content pre code { background: transparent; color: inherit; padding: 0; }
    .md-content hr { border: none; height: 1px; background: var(--border-light); margin: 18px 0; }
    .md-content a { color: var(--accent-primary); text-decoration: none; font-weight: 500; }
    .md-content a:hover { text-decoration: underline; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; color: var(--text-tertiary); }
    .empty-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; }
    .empty-text { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(26,23,20,0.45); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(6px); }
    .modal-backdrop.active { display: flex; }
    .modal-panel { background: var(--bg-surface); border-radius: 16px; width: 92%; max-width: 800px; max-height: 82vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
    .modal-header { padding: 20px 28px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-family: var(--font-serif); font-size: 18px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-tertiary); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.15s ease; }
    .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
    .modal-body { padding: 28px; overflow-y: auto; flex: 1; line-height: 1.8; font-size: 14px; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @media (max-width: 768px) {
      .topbar { padding: 0 20px; height: 56px; }
      .topbar-brand h1 { font-size: 18px; }
      .paper-strip { padding: 16px 20px; }
      .step-strip { padding: 0 20px; }
      .action-strip { padding: 0 20px; }
      .content-area { padding: 16px 20px 32px; }
      .answer-card { width: 85vw; min-height: 180px; }
      .dim-header { padding: 0 20px; }
      .cards-scroll { padding: 16px 20px 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <h1>对比分析</h1>
        <span>七步精读 · 横向维度对比</span>
      </div>
      <button class="btn-synthesis" id="btnSynthesis" disabled>生成 AI 综述</button>
    </header>

    <div class="paper-strip" id="paperStrip"></div>
    <div class="step-strip" id="stepStrip"></div>

    <div class="action-strip">
      <div class="action-info">
        <span class="step-name" id="currentStepName">请选择分析步骤</span>
        <span class="count" id="selectedCount">已选 0 个问题</span>
      </div>
      <div class="action-btns">
        <button class="btn-ghost" id="btnSelectAll" disabled>当前步骤全选</button>
        <button class="btn-ghost" id="btnClearAll" disabled>清空选择</button>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">请选择步骤和文献开始对比</div>
        <div style="font-size:13px;color:var(--text-tertiary);margin-top:8px;">点击上方文献卡片和步骤标签开始浏览</div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>AI 文献综述</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const DEMO_DATA = {"papers": [{"id": "0eff9f12-19b7-4948-b611-a0839b3c6ec7", "job_id": "032c7a1b-22bf-4150-b748-003052a646d7", "title": "土地整治、农业新质生产力与耕地利用生态效率_朱乾隆", "authors": [], "year": null, "journal": "", "doi": "", "steps": {"第一步：核心贡献识别": {"label": "第一步：核心贡献识别", "subQuestions": [{"id": "quant.step1.q1", "label": "1. 研究主题与核心结论", "content": "本文利用2005-2022年中国31个省份的面板数据，采用连续型双重差分（DID）模型，实证检验了以高标准农田建设为代表的土地整治政策对耕地利用生态效率的因果效应。核心结论是：土地整治显著提升了耕地利用生态效率，且这一效应通过培育农业新质生产力（尤其是新质劳动对象）来实现，并在中西部、山地和粮食主产区更为突出。"}, {"id": "quant.step1.q2", "label": "2. 问题意识", "content": "- **科学问题**：土地整治（特别是高标准农田建设）能否以及如何影响耕地利用的生态效率？其中的作用机制是什么？\n- **实践与政策意义**：在保障粮食安全与推动农业绿色转型的双重目标下，传统的“改土增产”型土地整治是否具备生态效益？该问题的回答直接关系到每年超千亿的农田建设资金应如何优化配置，以及如何通过政策设计协同实现“增产”与“减排”的平衡。"}, {"id": "quant.step1.q3", "label": "3. 重要性 (The \"So What?\" Question)", "content": "这个问题值得研究，因为：\n- **理论空白**：现有文献多关注土地整治的经济产出效应（如粮食产量），或单独测度耕地利用生态效率，但鲜有研究将二者因果关联并打开“黑箱”，尤其缺乏从“农业新质生产力”这一新概念视角的机制解释。\n- **政策困境**：若不解决此问题，我们无法判断高标准农田建设是否只是“面子工程”或仅带来短期增产，而可能忽视其长期生态代价（如碳排放、面源污染）。政策将缺乏科学依据来平衡“建设投入”与“绿色产出”，可能导致资源错配和生态退化。"}, {"id": "quant.step1.q4", "label": "4. 贡献定位", "content": "- **理论贡献**：\n  - **填补因果识别空白**：采用连续型DID模型，利用“土地整治面积占比”的连续变化识别政策强度差异，克服了传统二值DID分组的主观性，更精确地估计了政策的边际效应。\n  - **拓展机制分析**：首次将“农业新质生产力”作为中介机制引入土地整治与生态效率的分析框架，并细分了“新质劳动者、新质劳动资料、新质劳动对象”三个维度，发现“新质劳动对象”（如产业组织、生态治理）是主要传导路径，深化了对政策作用机理的理解。\n- **实践贡献**：\n  - **区域差异化施策**：发现政策效应在中西部、山地和粮食主产区更强，为“因区施策”提供了直接证据。建议在中西部和山区优先加大投入，而在东部平原地区应更注重生态技术升级而非单纯基建扩张。\n  - **政策协同方向**：明确了农业新质生产力（尤其是组织化、绿色化）是释放土地整治生态潜力的关键，建议将职业农民培训、数字农业、绿色技术推广等纳入高标准农田建设的配套政策体系，实现“工程”与“人才、技术”的联动。"}]}, "第二步：理论框架评估": {"label": "第二步：理论框架评估", "subQuestions": [{"id": "quant.step2.q5", "label": "5. 文献谱系", "content": "- **作为本文研究起点的文献：**\n  - [1] 罗必良. 论农业新质生产力[J]. 改革, 2024(4): 19-30. **（起点：界定农业新质生产力概念，为本文核心机制变量提供理论源头）**\n  - [2] 赵晶, 浦男萍, 谢恩怡, 等. 面向中国式现代化的耕地保护与治理：基本遵循、内在逻辑与实现路径[J]. 中国土地科学, 2025, 39(4): 1-11. **（起点：确立耕地保护与治理在现代化背景下的重要性，为本文研究问题提供政策背景）**\n  - [3] 吴诗嫚, 祝浩, 匡兵, 等. 高标准农田建设对耕地多功能利用水平的影响[J]. 中国农业资源与区划, 2025, 46(8): 160-171. **（起点：直接探讨高标准农田建设对耕地利用的影响，为本文研究主题提供直接切入点）**\n\n- **作为本文核心理论框架来源的文献：**\n  - [16] 孙学涛, 张丽娟, 王振华. 高标准农田建设对农业生产的影响——基于农业要素弹性与农业全要素生产率的视角[J]. 中国农村观察, 2023(4): 89-108. **（理论框架：提供“要素替代理论”作为解释土地整治优化投入结构的理论基础）**\n  - [21] 吴月丰, 何可, 朱润. 从自营到分工：高标准农田建设对农村劳动力质量的影响[J]. 宏观质量研究, 2025, 13(2): 27-41. **（理论框架：基于人力资本理论，阐述土地整治如何影响劳动者素质，构成新质劳动者维度的理论依据）**\n  - [23] 杨和平, 李红波. 农业新质生产力对耕地利用生态效率的影响——以长江经济带为例[J]. 中国土地科学, 2024, 38(11): 94-104. **（理论框架：直接建立“农业新质生产力-耕地利用生态效率”的理论关联，为本文中介机制提供核心逻辑链条）**\n\n- **为本文的分析视角合理性提供依据的文献：**\n  - [12] 黄先海, 黄雨晗, 虞柳明. 人工智能赋能农业新质生产力：实现逻辑、运行机制与跃升路径[J]. 中国农村经济, 2025(7): 3-22. **（合理性依据：论证农业新质生产力的技术驱动特征，为本文从该视角切入提供合理性）**\n  - [14] 孔祥智, 谢东东. 农业新质生产力的理论内涵、主要特征与培育路径[J]. 中国农业大学学报（社会科学版）, 2024, 41(4): 29-40. **（合理性依据：系统阐释农业新质生产力的内涵与特征，为本文将其作为机制变量提供理论合法性）**\n  - [15] 刘润秋, 刘诗雨. 土地要素助推农业新质生产力发展：逻辑、困境与路径[J]. 经济体制改革, 2025(3): 32-42. **（合理性依据：直接论证土地配置政策（土地整治）是培育农业新质生产力的抓手，为本文核心解释变量与机制变量的关联提供直接佐证）**\n\n- **为本文提供重要机制参考的文献：**\n  - [24] 江泽林, 徐卓顺, 王天新. 数字化赋能农业农村现代化的机理阐释与推进路径[J]. 农业经济问题, 2025(7): 4-12. **（机制参考：提供数字化作为新质劳动资料如何赋能农业的机制路径）**\n  - [27] 张琦, 鲁煜晨, 万君. 农业新质生产力促进农业绿色发展的理论逻辑、现实困境与推进路径[J]. 改革, 2025(3): 113-123. **（机制参考：阐述农业新质生产力促进绿色发展的理论逻辑，为本文新质劳动对象维度的机制解释提供支撑）**\n  - [28] 谢耄宜, 程艺萍, 常明. 农业新质生产力赋能农业全要素生产率：理论机制与实证检验[J]. 江西财经大学学报, 2025(4): 88-100. **（机制参考：提供农业新质生产力提升效率的实证机制证据，为本文机制检验提供方法参考）**\n\n- **为本文提供重要的实证方法借鉴的文献：**\n  - [29] 梁志会, 张露, 张俊飚. 土地整治与化肥减量——来自中国高标准基本农田建设政策的准自然实验证据[J]. 中国农村经济, 2021(4): 123-144. **（方法借鉴：直接借鉴其“连续型DID”模型设定，用“土地整治面积占比”作为政策强度变量）**\n  - [37] 张国建, 佟孟华, 李慧, 等. 扶贫改革试验区的经济增长效应及政策有效性评估[J]. 中国工业经济, 2019(8): 136-154. **（方法借鉴：借鉴其“事件分析法”进行平行趋势检验的具体做法）**\n  - [42] 江艇. 因果推断经验研究中的中介效应与调节效应[J]. 中国工业经济, 2022(5): 100-120. **（方法借鉴：严格遵循其“两步法”中介效应检验思路，避免传统三步法的内生性问题）**\n  - [30] 范正根, 邓超, 范雨琪, 等. “双碳”目标视角下耕地利用生态效率测度及其时空特征——以长江中下游粮食主产区为例[J]. 生态经济, 2023, 39(11): 119-127. **（方法借鉴：借鉴其使用Super-SBM-Undesirable模型测度耕地利用生态效率的方法）**\n  - [35] 金绍荣, 漆祥洪. 中国农业新质生产力：综合测度与动态演进[J]. 宏观质量研究, 2025, 13(3): 73-89. **（方法借鉴：借鉴其构建农业新质生产力评价指标体系（新质劳动者、劳动资料、劳动对象三维度）及熵值法测度方法）**"}, {"id": "quant.step2.q6", "label": "6. 理论基础", "content": "- **核心理论基础：要素替代理论与人力资本理论**\n  1.  **要素替代理论**：\n      - **应用**：解释土地整治如何通过改变一种要素（土地）的质量和形态，影响其他要素（劳动力、化肥、机械）的投入结构与效率。\n      - **关键要素**：土地（整治后的耕地质量）、劳动力（传统体力）、资本（机械、化肥）。\n      - **因果关系作用机制**：土地整治（如宜机化改造、土壤改良）提升了土地的可替代性或互补性 → 机械对劳动力的替代成为可能，同时土地自然生产力的提升减少了对化肥的依赖 → 优化了投入结构，降低非期望产出（碳排放、面源污染），从而提升生态效率。\n  2.  **人力资本理论**：\n      - **应用**：解释土地整治如何通过改变农业生产环境，进而影响农业劳动者的知识、技能和健康水平（即人力资本），从而提升其配置资源、采用新技术的能力。\n      - **关键要素**：农业劳动者（传统型 vs. 技能型/管理型）、受教育程度、数字技术掌握能力。\n      - **因果关系作用机制**：土地整治降低了技术应用门槛，提升了耕地长期经营价值 → 吸引高素质劳动力（“新农人”）回流，并激励现有劳动者提升技能 → 形成“新质劳动者” → 劳动者能更高效地配置耕地资源，精准施用绿色技术，从而提升生态效率。"}, {"id": "quant.step2.q7", "label": "7. 待检验假说", "content": "- **H1：土地整治对耕地利用生态效率的提升具有促进作用。**\n- **H2：农业新质生产力在土地整治影响耕地利用生态效率的过程中发挥中介作用。**"}, {"id": "quant.step2.q8", "label": "8. 创新点", "content": "- **H1的创新点**：\n  - **视角转换**：前人研究多关注土地整治对**粮食产能**[5]、**化肥减量**[29]或**农业绿色全要素生产率**[6]的单一影响。本文将其聚焦于**耕地利用生态效率**这一综合性指标，该指标整合了“经济-社会-生态”效益及非期望产出，更全面地反映了土地整治的绿色转型效果。\n  - **维度增加**：相较于仅关注“是否”实施整治（传统DID），本文采用**连续型DID模型**，引入“土地整治面积占比”这一强度变量，捕捉了政策实施程度的差异，是对梁志会等[29]方法的直接应用和拓展，能更精准地识别政策效应。\n- **H2的创新点**：\n  - **新要素引入**：前人研究在探讨土地整治的机制时，多从**规模经营**[18]、**技术进步**[19]或**要素替代**[16]等传统视角出发。本文创新性地引入**“农业新质生产力”**这一前沿概念作为中介变量，开辟了一个全新的机制解释通道。\n  - **理论框架的整合与细化**：本文并非简单套用“新质生产力”概念，而是将其**分解为“新质劳动者、新质劳动资料、新质劳动对象”三个维度**，并分别论证土地整治如何通过这三个维度影响生态效率。这在杨和平和李红波[23]的基础上，进一步**细化了作用路径**，明确了土地整治对不同维度生产力的差异化提升效应（如对新质劳动对象提升更明显），使得机制分析更具颗粒度。\n  - **对前人理论的改进**：前人研究（如[21]）探讨了土地整治对劳动力的影响，但未上升到“新质劳动者”的理论高度。本文将其整合进“新质生产力”框架，并补充了土地整治如何通过改善劳动资料（数字化）和劳动对象（产业组织）来发挥中介作用，是对相关单个机制研究的**系统性整合与理论升华**。"}, {"id": "quant.step2.q9", "label": "9. 逻辑推演", "content": "- **H1的微观机制：土地整治 → 耕地利用生态效率**\n  1.  **优化投入结构**：土地平整和宜机化改造提高了机械适用性，使得**机械替代劳动力**成为可能，减少低效人力投入；同时，提升的耕地质量和土壤肥力，降低了**化肥等化学投入品的边际需求**。投入减少直接降低了非期望产出（碳排放、污染）。\n  2.  **提升集约利用水平**：田块整合与设施配套，解决了耕地细碎化问题，实现了**集中连片**。这促进了规模经营，减少了田埂和边角地的资源浪费，提高了单位面积耕地的期望产出（经济、社会效益）。\n  3.  **推动绿色转型**：通过中低产田改造、生态沟渠建设等措施，直接**改善了农田生态系统**。这有助于增强土壤固碳能力、减少水土流失和面源污染，从而在产出水平不变或提高的情况下，降低了非期望产出，最终提升了生态效率。\n\n- **H2的微观机制：土地整治 → 农业新质生产力 → 耕地利用生态效率**\n  - **路径一：新质劳动者**\n    - 土地整治改善生产环境 → 降低技术应用门槛，提升耕地经营价值 → 吸引高素质、懂技术的“新农人”回流，激励传统农民向技能型、管理型转变 → **劳动者人力资本提升（新质劳动者）** → 能更精准地施用绿色技术、优化资源配置，从而提升生态效率。\n  - **路径二：新质劳动资料**\n    - 土地整治为农业机械化、智能化提供物理空间（如连片田块）和数据基础（如物联网监测） → 推动劳动资料从传统高能耗机械向**低碳、精准、智能化的数字农业设备**升级（新质劳动资料） → 实现精准施肥、智能灌溉，降低资源冗余与碳排放，提升生态效率。\n  - **路径三：新质劳动对象**\n    - 土地整治实现耕地集中连片 → 为新型经营主体（合作社、龙头企业）的**规模化、专业化、组织化经营**创造条件（新质劳动对象） → 规模经营主体更倾向于采用绿色技术、进行品牌化建设，并利用数字技术优化产加销全链条，从而降低单位产出的环境成本，提升生态效率。"}]}, "第三步：方法论批判": {"label": "第三步：方法论批判", "subQuestions": [{"id": "quant.step3.q10", "label": "10. 数据来源", "content": "该研究使用的数据全部为**公开数据**，未涉及独家调研或非公开数据库。具体来源包括：\n- **官方统计年鉴**：\n  - 《中国财政统计年鉴》：用于获取土地整治面积与农业综合开发投入数据。\n  - 《中国人口与就业统计年鉴》：用于获取农村居民受教育年限数据。\n  - 《中国农村统计年鉴》《中国统计年鉴》：用于获取农业产出、投入、耕地面积、碳排放等核心变量数据。\n  - 各省（市、区）《统计年鉴》：用于补充省级层面的缺失数据。\n- **其他公开数据**：\n  - 农业碳排放、面源污染等非期望产出指标，基于文献中已公开的计算公式（如李强等[32]、王宝义和张卫国[33]）自行测算，并非直接下载的现成数据集。\n  - 农业新质生产力指标体系中的“淘宝村数量”“数字农业企业数量”等指标，未明确说明具体来源，推测来自公开的行业报告或政府公开名录（如阿里研究院、农业农村部公开数据），但论文未提供具体下载路径或查询方式。\n\n**关键问题**：论文未提供任何数据获取的具体URL、API接口或数据库查询语句，也未说明是否使用了CNKI、EPS数据平台等商业数据库。对于“淘宝村数量”“数字农业企业数量”等非传统统计指标，缺乏来源透明度。"}, {"id": "quant.step3.q11", "label": "11. 获取与清洗", "content": "- **公开数据**：\n  - **获取方式**：论文仅笼统提及数据来自上述年鉴，未提供任何具体获取途径（如直接从国家统计局网站下载、通过EPS数据平台检索、手工录入等）。对于2005-2022年的31个省份面板数据，时间跨度较长，若手工录入多个年鉴，存在录入错误风险；若使用商业数据库，应注明版本号。\n  - **清洗步骤**：\n    - 缺失值处理：采用“线性插值法填补少量缺失值”，但未说明“少量”的具体比例（如缺失率是否超过5%），也未报告哪些变量缺失最多。线性插值法适用于时间序列中的连续缺失，但若缺失集中在某一省份或某一时期，可能引入系统性偏误。\n    - 连续变量：进行了“对数化处理”，但未说明是对所有连续变量取对数（如土地整治面积占比、耕地利用生态效率本身已为比率，取对数后可能改变经济含义），还是仅对绝对量指标取对数。\n    - 异常值处理：仅在稳健性检验中对高标准农田建设面积进行“前后5%的截尾处理”，未在基准回归中说明是否进行了缩尾或去极值处理。\n  - **具体来源缺失**：论文未给出任何变量的原始数据来源表格（如每个变量对应哪个年鉴的哪张表格、第几页），这在实证论文中属于严重的信息不透明。\n\n- **文本分析**：未使用。农业新质生产力指标中的“淘宝村数量”“数字农业企业数量”等可能涉及文本挖掘或网络爬虫，但论文未提及任何文本分析工具（如Python、R的文本包）或数据抓取过程。"}, {"id": "quant.step3.q12", "label": "12. 数据生成的微观结构 (DGP)", "content": "数据生成过程中存在以下系统性偏差风险：\n- **幸存者偏差**：\n  - 土地整治面积占比（RLCi）仅统计了“已改造的中低产田面积和高标准农田面积之和”，但未考虑：\n    - 已建成高标准农田的后续退化或失管情况（如设施老化后沦为“低标准”），可能导致高估实际有效整治面积。\n    - 因城镇化、工业化而被占用的耕地，其整治面积是否被剔除？若未剔除，可能将“已消失”的耕地纳入分母，造成面积占比虚高。\n- **自选择问题**：\n  - 高标准农田建设并非随机分配。论文虽使用连续型DID模型控制了个体和时间固定效应，但未处理“政策实施强度”的内生性。例如：经济发达、农业基础好的省份可能更早、更大规模地推进土地整治（正向选择），而欠发达地区可能因财政压力而延迟实施（负向选择）。这种自选择会导致估计系数有偏。\n  - 农业新质生产力指标中的“淘宝村数量”“数字农业企业数量”等变量，本身可能受地方经济发展水平、基础设施投资等不可观测因素影响，这些因素同时影响土地整治效果，导致中介效应估计存在遗漏变量偏误。\n- **测量误差**：\n  - 耕地利用生态效率的投入产出指标中，劳动力投入采用“第一产业从业人员数×(农业产值/农林牧渔业总产值)/耕地总面积”估算，但第一产业从业人员包含林业、牧业、渔业，比例调整可能引入系统性误差（如农业产值占比波动大的省份）。\n  - 农业碳排放和面源污染的计算依赖固定排放系数（如化肥、农药的碳排放因子），这些系数可能因区域、作物类型、耕作方式不同而存在差异，但论文使用了全国统一系数，导致非期望产出存在测量误差。\n- **样本代表性**：\n  - 31个省份包含北京、上海、天津等直辖市，其农业产值占比极低，耕地面积小，土地整治面积占比可能因分母过小而被夸大。论文未进行直辖市与普通省份的敏感性分析（如剔除直辖市后回归）。"}]}, "第四步：实证结果解读": {"label": "第四步：实证结果解读", "subQuestions": [{"id": "quant.step4.q13", "label": "13. 核心变量定义", "content": "- **Y（被解释变量）**：耕地利用生态效率（EECLU）。其定义为在耕地利用过程中，通过劳动力、机械、化肥等各类生产要素投入，实现单位面积耕地在经济效益、社会效益和生态效益上的综合产出最大化，从而实现“经济—社会—生态”目标的和谐统一。文献来源包括 Yang et al. (2021)、Fan et al. (2024) 和薛选登、谢宇 (2024)。\n- **X（核心解释变量）**：土地整治（RLCi×I post t）。具体定义为各省份土地整治面积占比（RLCi，即改造中低产田面积和高标准农田面积之和占耕地面积的比重）与高标准农田建设政策实施时间虚拟变量（I post t，2011年及之后取1，之前取0）的交互项。文献来源包括梁志会等 (2021) 和龚燕玲、张应良 (2023)。"}, {"id": "quant.step4.q14", "label": "14. 衡量方式", "content": "- **Y：耕地利用生态效率（EECLU）**：属于构建的综合指标，非直接观测。具体构成要素和算法如下：\n  - **投入指标**：劳动力（第一产业从业人员数×农业产值/农林牧渔业总产值/耕地总面积）、机械（农业机械总动力/耕地总面积）、灌溉（有效灌溉面积/耕地总面积）、化肥（化肥施用量当量/耕地总面积）、农药（农药施用量当量/耕地总面积）、农膜（农膜使用量/耕地总面积）、能源（农用柴油使用量/耕地总面积）。\n  - **产出指标**：\n    - 期望产出：经济效益（农业总产值/耕地总面积）、社会效益（粮食总产量/耕地总面积）、生态效益（碳汇总量/耕地总面积）。\n    - 非期望产出：耕地碳排放（农业碳排放量/耕地总面积）、耕地面源污染（农业面源污染排放/耕地总面积）。\n  - **算法**：使用 Super-SBM-Undesirable 模型，借助 MATLAB R2022a 软件计算。其中，碳汇量根据李强等 (2022) 方法计算，碳排放量根据化肥、农药、农膜、柴油、翻耕和灌溉等环节综合计算，面源污染根据王宝义和张卫国 (2016) 方法计算。\n- **X：土地整治（RLCi×I post t）**：属于直接观测与构造变量结合。RLCi 为直接观测的“土地整治面积占比”，I post t 为政策时间虚拟变量，二者交互形成核心解释变量。\n- **M（机制变量）**：农业新质生产力（ANQP）。属于构建的综合指标。具体构成要素和算法如下：\n  - **一级指标**：新质劳动者、新质劳动资料、新质劳动对象。\n  - **二级与三级指标**：共22个三级指标，包括农村居民人均可支配收入、农林牧渔总产值/乡村从业人数、农村居民平均受教育年限、农村用电量/乡村总人口、农村公路密度、节水灌溉面积比重、农业R&D经费投入、农村数字普惠金融移动支付指数、淘宝村数量、农民专业合作社数量、水土流失治理面积、农业COD排放量/第一产业产值、环境保护支出/一般公共预算支出总额、美丽乡村数量等。\n  - **算法**：采用熵值法计算2005—2022年31个省份的农业新质生产力发展水平。"}, {"id": "quant.step4.q15", "label": "15. 控制变量", "content": "选择了7个控制变量（Z），具体如下：\n- **复种指数（MI）**：农作物播种面积与耕地面积之比。控制农业生产强度对效率的影响。\n- **财政支农水平（FS）**：农林水事务支出占一般公共预算支出的比重。控制政府财政投入对农业生产的支持效应。\n- **农村人力资本（RHC）**：农村居民平均受教育年限。控制劳动力素质对效率的影响。\n- **受灾程度（CTD）**：农作物受灾面积占总播种面积的比重。控制自然灾害对产出的负面冲击（供给冲击）。\n- **土地资源禀赋（LRE）**：耕地总面积与乡村人口数的比值。控制人均耕地资源丰裕度对效率的影响。\n- **产业结构（IS）**：第一产业产值占地区GDP的比重。控制经济结构对农业效率的影响。\n- **作物种植结构（CPS）**：粮食作物播种面积与农作物播种面积的比值。控制种植结构差异对效率的影响。\n\n**选择依据**：这些变量综合控制了**供给冲击**（如受灾程度）、**要素投入结构**（如复种指数、土地资源禀赋、作物种植结构）、**外部政策环境**（如财政支农水平）以及**人力资本质量**（如农村人力资本），以减少遗漏变量偏误，识别土地整治政策的净效应。文献来源包括 Yang et al. (2021)、杨和平和李红波 (2024)、李继霞等 (2023)。"}, {"id": "quant.step4.q16", "label": "16. 机制分析变量与特殊处理", "content": "- **机制分析变量**：\n  - **中介变量**：农业新质生产力（ANQP）。具体衡量方式为构建的综合指数（详见第14点）。分析方法采用江艇 (2022) 的两步法中介效应检验：第一步验证土地整治对ANQP的影响（表7第1列），第二步进一步将ANQP分解为三个维度（新质劳动者ANQP_1、新质劳动资料ANQP_2、新质劳动对象ANQP_3）分别回归（表7第2-4列），以识别具体作用路径。\n  - **调节变量**：未使用调节变量。\n  - **异质性分析**：\n    - **地理区位**：将样本分为东部地区和中西部地区，分别回归（表6第1-2列）。\n    - **地形条件**：将样本分为平原为主和山地为主两组，分别回归（表6第3-4列）。\n    - **农业功能区定位**：将样本分为粮食主产区和非粮食主产区，分别回归（表6第5-6列）。\n  - **门槛分析**：未进行门槛分析。\n\n- **特殊处理**：\n  - **对数化处理**：对连续变量进行了对数化处理，以提高数据的可比性。\n  - **缺失值处理**：采用线性插值法填补少量缺失值。\n  - **滞后处理**：在内生性处理中，采用解释变量和控制变量的一期滞后项进行回归（表5第5列）。\n  - **截尾处理**：在样本选择偏差检验中，对各地区高标准农田建设面积进行前后5%的截尾处理（表5第6列）。\n  - **去通胀处理**：未明确说明去通胀处理。"}]}, "第五步：局限性分析": {"label": "第五步：局限性分析", "subQuestions": [{"id": "quant.step5.q17", "label": "17. 计量模型", "content": "核心回归方程为连续型双重差分（Continuous DID）模型：\n\n\\[\nEECLU_{it} = \\alpha_0 + \\beta_0 (RLC_i \\times I^{post}_t) + \\lambda_0 X_{it} + \\delta_i + \\theta_t + \\varepsilon_{it}\n\\]\n\n其中：\n- \\(EECLU_{it}\\)：被解释变量，省份 \\(i\\) 在年份 \\(t\\) 的耕地利用生态效率（由 Super-SBM-Undesirable 模型测算）。\n- \\(RLC_i\\)：连续型处理强度变量，表示省份 \\(i\\) 的土地整治面积占比（改造中低产田面积与高标准农田面积之和 / 耕地面积）。\n- \\(I^{post}_t\\)：政策时间虚拟变量，\\(t \\geq 2011\\) 时取 1，否则为 0（2011 年为全国高标准农田建设政策起始年）。\n- \\(RLC_i \\times I^{post}_t\\)：核心解释变量，交互项系数 \\(\\beta_0\\) 捕捉土地整治强度随政策实施对生态效率的因果效应。\n- \\(X_{it}\\)：控制变量向量，包括复种指数、财政支农水平、农村人力资本、受灾程度、土地资源禀赋、产业结构、作物种植结构。\n- \\(\\delta_i\\) 和 \\(\\theta_t\\)：分别为省份固定效应和年份固定效应，控制不可观测的地区异质性和共同时间趋势。"}, {"id": "quant.step5.q18", "label": "18. 识别挑战", "content": "核心解释变量 \\(RLC_i \\times I^{post}_t\\) 的 **外生性存疑**，潜在内生性来源包括：\n\n- **遗漏变量**：各省份土地整治面积占比（\\(RLC_i\\)）并非随机分配，可能与当地经济发展水平、农业政策倾向、地方官员激励等不可观测因素相关。例如，经济发达或农业基础好的省份可能更早、更大规模地推进高标准农田建设，而这些因素本身也影响耕地利用生态效率，导致遗漏变量偏误。\n- **反向因果**：耕地利用生态效率较高的地区，可能更容易获得土地整治项目资金（如地方政府倾向于优先在生态效率高的区域投入），形成反向因果。作者虽在稳健性检验中使用一期滞后项处理，但未在基准模型中解决此问题。\n- **测量误差**：\\(RLC_i\\) 的测算依赖“改造中低产田面积”和“高标准农田面积”的官方统计数据，可能存在统计口径不一致、上报偏差等问题，导致测量误差，从而衰减估计系数。"}, {"id": "quant.step5.q19", "label": "19. 解决策略", "content": "作者采用 **连续型双重差分（Continuous DID）** 策略，而非传统二值 DID，具体如下：\n\n- **核心思路**：利用各省份土地整治面积占比（\\(RLC_i\\)）作为连续的处理强度变量，结合政策实施时间虚拟变量（\\(I^{post}_t\\)），构建交互项。相较于传统 DID（仅区分实验组/对照组），连续型 DID 能捕捉政策实施程度差异对结果变量的影响，避免人为划分组别的主观性。\n- **内生性缓解手段**：\n  - **固定效应**：控制省份固定效应（\\(\\delta_i\\)）吸收不随时间变化的地区特征（如地形、气候、初始农业基础）；年份固定效应（\\(\\theta_t\\)）控制共同时间趋势（如全国性农业政策冲击）。\n  - **控制变量**：纳入复种指数、财政支农水平、受灾程度等时变因素，减少遗漏变量偏误。\n  - **滞后项处理**：在稳健性检验中，使用解释变量和控制变量的一期滞后项进行回归，部分缓解反向因果。\n- **未使用工具变量（IV）**：作者未寻找外生工具变量，因此无法完全排除遗漏变量（如地方官员晋升激励）和测量误差导致的内生性问题。连续型 DID 的识别假设仍依赖于“在控制固定效应和协变量后，土地整治强度变化与误差项不相关”，这一假设较强。"}, {"id": "quant.step5.q20", "label": "20. 机制检验", "content": "**影响机制图谱（Mechanism Map）**：\n\n```mermaid\ngraph TD\n    X[\"土地整治 (RLCi × Ipost_t)\"] --> M[\"农业新质生产力 (ANQP)\"]\n    X -->|直接影响| Y[\"耕地利用生态效率 (EECLU)\"]\n    M --> Y\n    \n    subgraph M分解\n        M1[\"新质劳动者 (ANQP_1)\"]\n        M2[\"新质劳动资料 (ANQP_2)\"]\n        M3[\"新质劳动对象 (ANQP_3)\"]\n    end\n    \n    X --> M1\n    X --> M2\n    X --> M3\n    \n    M1 --> Y\n    M2 --> Y\n    M3 --> Y\n    \n    style X fill:#f9f,stroke:#333,stroke-width:2px\n    style Y fill:#9f9,stroke:#333,stroke-width:2px\n    style M fill:#ff9,stroke:#333,stroke-width:2px\n```\n\n**机制检验方法**：\n- 作者借鉴江艇（2022）两步法中介效应：第一步，检验土地整治对农业新质生产力（ANQP）的影响（表7第1列，系数0.036，p<0.01）；第二步，假设主效应已显著，不再单独检验ANQP对EECLU的回归（江艇建议避免“中介效应三步法”的偏误）。\n- 进一步分解ANQP为三个子维度：新质劳动者（ANQP_1）、新质劳动资料（ANQP_2）、新质劳动对象（ANQP_3）。结果显示，土地整治对ANQP_3（系数0.018）的促进作用大于ANQP_1（0.008）和ANQP_2（0.009），表明“劳动对象升级”（如产业组织优化、生态治理）是主要传导路径。"}, {"id": "quant.step5.q21", "label": "21. 稳健性检验 (Robustness)", "content": "- **识别假设检验**：\n  - **平行趋势检验**：使用事件分析法，以2005年为基期，绘制2006-2022年估计系数动态图（图2）。政策实施前（2011年前）系数在95%置信区间内不显著，满足平行趋势假设。\n  - **安慰剂检验**：未明确报告，但作者通过替换解释变量（农业综合开发资金投入）和被解释变量（调整碳排放指标）进行间接安慰剂检验。\n  - **排他性约束检验**：未直接检验，但通过控制其他并行政策（千亿斤粮工程、土地流转政策）的虚拟变量（表5第1列），部分排除竞争性政策干扰。\n\n- **替代性解释排除**：\n  - 排除并行政策：在回归中加入千亿斤粮产能提升工程和土地流转政策的虚拟变量后，核心系数仍显著（0.024，p<0.1），但系数大幅下降（从0.049降至0.024），说明部分效应可能被其他政策吸收，但土地整治的净效应仍存在。\n  - 样本截尾处理：剔除高标准农田建设面积前后5%的极端值后，结果稳健（系数0.042，p<0.01）。\n\n- **异质性分析**：\n  - **地理区位**：中西部地区效应显著（系数0.075，p<0.01），东部地区不显著（0.012，p>0.1）。解释：东部农业基础好，边际改善空间小；中西部基础设施薄弱，政策红利更大。\n  - **地形条件**：山地地区效应（系数0.054，p<0.05）略高于平原地区（0.049，p<0.01），表明土地整治对缓解耕地细碎化、改善山地生态效益更突出。\n  - **农业功能区**：粮食主产区效应（0.075，p<0.01）显著强于非主产区（0.022，p<0.1），主产区政策叠加效应（如机械化、规模化支持）强化了生态效率提升。\n\n**批评性评价**：作者未进行安慰剂检验（如随机分配政策时间或处理强度），也未使用工具变量或边界断点回归（RDD）进一步解决内生性。异质性分析虽揭示区域差异，但未解释为何东部地区效应不显著（如样本量小、或生态效率已接近前沿水平）。机制检验中，两步法仅验证了X→M路径，未直接检验M→Y的因果关系（如通过工具变量或结构方程模型），因此机制推断的可靠性有限。"}]}, "第六步：实践意义": {"label": "第六步：实践意义", "subQuestions": [{"id": "quant.step6.q22", "label": "22. 结果解读", "content": "- **基准回归**：土地整治（RLCi×I post t）对耕地利用生态效率（EECLU）的估计系数在加入控制变量后为0.049（P<0.01），显著为正。这表明高标准农田建设每提升1个标准差（约1.943%），耕地利用生态效率平均提升约0.095个标准差（基于标准化系数估算），具有统计显著性和经济显著性。\n- **机制分析**：农业新质生产力（ANQP）作为中介变量，其系数为0.036（P<0.01），显著为正。分维度看，新质劳动者（ANQP_1）、新质劳动资料（ANQP_2）和新质劳动对象（ANQP_3）的系数分别为0.008、0.009和0.018，均显著（P<0.01）。其中，新质劳动对象的系数最大，表明土地整治主要通过改善劳动对象（如产业组织、生态治理）来提升生态效率。\n- **不显著结果**：在异质性分析中，东部地区的估计系数为0.012（P>0.1），未通过显著性检验。可能原因：东部地区农业基础设施已较完善，土地整治的边际改善空间有限；同时，东部地区非期望产出（如工业污染）可能对耕地生态效率产生抵消效应，导致政策效应被稀释。\n- **稳健性检验**：所有稳健性检验（排除并行政策、替换变量、增加控制变量、内生性处理、样本截尾）中，核心系数均保持显著（P<0.01或P<0.1），表明结果对模型设定敏感度低。"}, {"id": "quant.step6.q23", "label": "23. 评价", "content": "- **经济学含义**：土地整治通过优化要素配置（如减少化肥投入、提升机械化水平）和改善生态功能（如降低碳排放），直接提升耕地利用生态效率。同时，农业新质生产力作为中介机制，反映了技术进步和制度创新在绿色转型中的驱动作用。这符合“波特假说”：环境规制（如高标准农田建设）可通过技术创新补偿生态成本。\n- **与理论一致性**：结果与要素替代理论（土地整治减少劳动力依赖）、人力资本理论（提升劳动者素质）和规模经济理论（集中连片降低资源浪费）高度一致。但需注意，理论中“土地整治可能短期增加碳排放（如施工机械使用）”的负面效应未被检验，可能被长期生态效益掩盖。\n- **实证假设满足性**：\n  - **平行趋势假设**：图2显示政策实施前（2005-2010年）估计系数置信区间包含0，满足假设。但需注意，事件分析法的置信区间在政策前个别年份（如2008年）略偏离0，可能暗示轻微的前瞻性效应（anticipation effect），但整体可接受。\n  - **外生性假设**：连续型DID假设土地整治面积占比（RLCi）与误差项不相关。但RLCi可能受地方财政能力、政治偏好影响（如经济发达省份更早推进整治），导致内生性。作者使用滞后一期解释变量处理反向因果，但未使用工具变量（如历史降雨量或地形坡度）解决遗漏变量问题，内生性处理较弱。\n  - **SUTVA假设**：未检验土地整治的溢出效应（如邻近省份的生态效率可能因示范效应或污染转移而受影响），可能违反“个体处理效应稳定”假设。"}, {"id": "quant.step6.q24", "label": "24. 讨论", "content": "- **与其他文献的一致性**：\n  - 与Li et al. (2023)和Tang et al. (2023)的结果一致，均发现高标准农田建设降低农业碳排放。但本研究进一步量化了生态效率的综合提升，而非单一碳效应。\n  - 与孙学涛等 (2023)的结论一致，即土地整治通过要素替代（如机械替代劳动力）提升全要素生产率，但本研究补充了生态效率维度。\n  - 与杨和平和李红波 (2024)的结果一致，即农业新质生产力在长江经济带提升耕地利用生态效率，但本研究将分析范围扩展至全国。\n- **矛盾之处**：\n  - 与薛选登和谢宇 (2024)的发现略有矛盾：后者指出黄河流域耕地利用生态效率呈空间收敛趋势，但本研究发现土地整治在非粮食主产区效应不显著（系数0.022，P<0.1），可能因黄河流域包含非主产区（如内蒙古），其政策效应被其他因素（如水资源约束）抵消。\n  - 与Fan et al. (2024)的结论部分矛盾：后者发现长三角地区耕地利用生态效率受城镇化负向影响，但本研究未控制城镇化率（仅在稳健性检验中补充），可能高估土地整治效应。\n- **方法差异**：本研究使用连续型DID而非传统二值DID，更准确捕捉政策强度差异，但代价是识别假设更强（需连续处理变量的外生性）。相比之下，梁志会等 (2021)采用类似方法研究化肥减量，本研究的稳健性检验更全面（如排除并行政策）。"}, {"id": "quant.step6.q25", "label": "25. 政策含义", "content": "- **精准施策**：土地整治应优先向中西部地区、山地地形和粮食主产区倾斜，因为这些区域的政策边际效应更高（系数分别为0.075、0.054和0.075）。例如，中西部地区可结合“退耕还林”与高标准农田建设，实现生态与产能双赢。\n- **机制强化**：农业新质生产力是核心传导渠道，政策应聚焦“新质劳动对象”维度（如培育农业龙头企业、推广绿色农业合作社）。具体措施包括：设立专项基金支持数字农业企业入驻整治区；将生态治理指标（如水土流失治理面积）纳入高标准农田验收标准。\n- **区域差异化**：东部地区应避免“一刀切”的整治模式，转向“生态修复+精准灌溉”的精细化方案，例如在长三角推广“稻田湿地”模式，兼顾碳汇与生物多样性。\n- **风险警示**：政策需警惕“生态效率陷阱”——土地整治可能短期推高农业碳排放（如施工机械使用），建议建立“碳预算”制度，要求整治项目配套碳补偿（如植树造林）。同时，应监测非期望产出（如面源污染）的动态变化，避免生态效率提升以牺牲其他环境指标为代价。"}]}, "第七步：未来方向": {"label": "第七步：未来方向", "subQuestions": [{"id": "quant.step7.q26", "label": "26. 致命伤 (The Achilles' Heel)", "content": "本文最大的弱点在于**因果识别策略的严重内生性问题**，具体表现为“土地整治面积占比”（RLCi）的构建与模型设定存在根本性缺陷。\n\n- **核心解释变量的内生性**：作者使用“各省改造中低产田面积和高标准农田面积之和占耕地面积的比重”（RLCi）作为连续型处理变量。然而，这一变量的分配并非随机，而是与地方经济发展水平、财政能力、农业资源禀赋、甚至生态效率的初始水平高度相关。例如，中西部农业大省可能因耕地面积大、基础设施差而获得更多整治项目，但这些省份的生态效率本身可能就处于较低水平且存在收敛趋势。因此，RLCi 与误差项中的遗漏变量（如地方环境规制强度、农业技术进步趋势）高度相关，导致估计系数（0.049）存在显著的内生性偏误。\n- **平行趋势假设的不可信性**：尽管作者进行了事件分析法（图2），但该方法仅验证了“处理强度”与“结果变量”在政策前无显著系统性差异，而非传统 DID 的“组别”平行趋势。由于 RLCi 是连续变量，政策实施前各省份的生态效率变化趋势可能因其固有特征（如地形、经济结构）而不同，这些特征又与未来的整治面积相关。因此，图2显示的“不显著”可能掩盖了基于处理强度的非线性趋势差异，平行趋势假设的满足条件极其脆弱。\n- **遗漏变量与反向因果的未尽处理**：作者在稳健性检验中仅加入“千亿斤粮工程”和“土地流转”虚拟变量，并采用一期滞后项处理内生性。但这些措施远不足以解决核心问题。例如，地方政府可能基于前期的生态效率变化（如碳排放下降）而决定增加或减少后续的整治投入，形成反向因果。此外，未控制如“地方财政自主度”、“农业保险覆盖率”等随时间变化的混杂因素，使得估计结果难以被解释为纯粹的因果效应。"}, {"id": "quant.step7.q27", "label": "27. 未来选题", "content": "基于本文的致命弱点，未来研究可从以下两个方向进行突破：\n\n- **选题一：利用政策冲击的时空变异，设计更严谨的因果识别策略**\n  - **问题**：本文的连续型 DID 无法解决 RLCi 的内生分配问题。\n  - **新选题**：**《高标准农田建设任务的“外生冲击”：基于县级建设任务指标的断点回归分析》**。利用中央或省级政府向各县分配高标准农田建设任务时，可能依据的“耕地面积阈值”或“财政能力分数线”等规则，采用断点回归设计（RDD）。例如，在某个耕地面积阈值附近，面积稍大或稍小的县获得了显著不同的建设任务量，但这种细微差异与当地生态效率的潜在趋势无关，从而可以干净地识别因果效应。\n  - **优势**：RDD 在阈值附近近似于随机实验，能有效规避处理变量（建设面积）的内生性问题，提供更可信的局部平均处理效应（LATE）。\n\n- **选题二：从“总量效应”转向“结构分解”，识别具体作用渠道的异质性因果效应**\n  - **问题**：本文仅检验了农业新质生产力的中介效应，但未能区分土地整治是通过“耕地质量提升”还是“经营规模扩大”等具体渠道提升生态效率，且未解决中介变量的内生性。\n  - **新选题**：**《土地整治的“规模效应”与“技术效应”：基于地块级数据和工具变量法的分解研究》**。利用高分辨率遥感影像和地块级调查数据，将土地整治对生态效率的影响分解为“规模效应”（田块合并带来的机械效率提升）和“技术效应”（灌溉设施改善带来的化肥减量）。针对“土地整治面积”这一内生变量，可使用“历史上同一流域的洪水冲击导致的农田损毁面积”作为工具变量（IV），因为该工具变量影响整治需求，但与当前生态效率无直接关联。\n  - **优势**：通过结构分解和 IV 方法，不仅解决了内生性，还能揭示土地整治发挥作用的具体微观机制，为差异化政策设计（如针对规模不足或技术落后的地区）提供精确指导。"}]}}}, {"id": "1c23d184-0d89-4027-9421-c954ec02371d", "job_id": "b78aa784-dd48-40c0-beb6-12cea6739241", "title": "生态产品价值实现的中国经验——基于国家部委典型案例的实践解构与理论阐释_逯浩", "authors": [], "year": null, "journal": "", "doi": "", "steps": {"第一步：核心贡献识别": {"label": "第一步：核心贡献识别", "subQuestions": [{"id": "quant.step1.q1", "label": "1. 研究主题与核心结论", "content": "本文系统解构了国家部委发布的生态产品价值实现典型案例，归纳出“生态空间资源-生态公共品-生态消费品”三层级价值增值路径，以及“外溢共享、配额交易、赋能增值”三种实践策略，并提炼出“生态赤字恢复→生态价值深化→生态资本深化”的三阶段价值显化路径。核心结论是：中国通过系统性顶层设计与因地制宜的实践创新，实现了生态产品从公共品向要素化资产和资本的战略转型，证明了“生态保护必然牺牲经济增长”是伪命题。"}, {"id": "quant.step1.q2", "label": "2. 问题意识", "content": "- **具体科学问题**：如何从国家多部委发布的分散化、地域化的生态产品价值实现典型案例中，提炼出具有普遍解释力的理论框架和实践逻辑？即：中国经验中，生态产品价值实现的“创新逻辑”与“阶段路径”是什么？\n- **实践与政策意义**：\n  - **实践层面**：为地方政府（尤其是生态脆弱区、资源枯竭型地区）提供了从生态修复到价值变现的操作指南（如鄂州生态补偿、徐州矿坑修复、丽水品牌溢价）。\n  - **政策层面**：为“两山”理念从政策话语向可操作制度体系的转化提供了学理支撑，直接服务于党的二十届三中全会关于“健全生态产品价值实现机制”的改革部署。"}, {"id": "quant.step1.q3", "label": "3. 重要性 (The \"So What?\" Question)", "content": "- **为什么值得研究**：因为现有研究多停留于单一维度的概念辨析或个案描述，严重缺乏对“中国经验”的系统化理论提炼。若不解决，将导致：\n  - 国家投入巨额财政的生态修复项目（如转移支付、PPP）缺乏可持续的机制设计，陷入“修复-贬值-再修复”的循环。\n  - 地方政府在“两山”转化中可能机械套用模板（如盲目发展生态旅游），忽视生态本底的空间异质性，造成二次生态破坏与财政浪费。\n  - 全球生态文明建设将失去一个可参照的、非西方中心主义的制度性解决方案。"}, {"id": "quant.step1.q4", "label": "4. 贡献定位", "content": "- **理论贡献**：\n  - **填补空白**：填补了“生态产品价值实现”领域从“政策案例汇总”到“理论模型构建”的空白。此前文献（如欧阳志云等，2013；高晓龙等，2019）多聚焦于核算方法或政策工具分类，本文首次基于多部委权威案例，提出了一个包含**三层级（空间资源-公共品-消费品）**、**三策略（外溢共享-配额交易-赋能增值）**、**三阶段（赤字恢复-价值深化-资本深化）** 的整合分析框架。\n  - **修正模型**：修正了西方公共经济学中将生态产品简单视为“纯公共品”的静态模型，指出中国实践中生态产品具有**从公共品向要素化资产跃迁**的动态属性，且其价值实现依赖于**政府主导的耐心资本投入**与**市场化的产权交易体系**的耦合。\n- **实践贡献**：\n  - **对政策制定**：明确提出了“因地制宜”的原则，反对“标准化移植”，并具体指出不同发展阶段（赤字/深化/资本）应匹配不同的主导路径（配额/外溢/赋能），为各级发改委、自然资源部门制定差异化考核与补偿机制提供了理论依据。\n  - **对商业实践**：揭示了“生态银行”“林权/碳汇交易平台”“区域公共品牌（如丽水山耕）”等模式背后的产权经济学逻辑，为市场主体（如金融机构、绿色企业）参与生态资源资本化提供了可复制的交易结构设计思路。"}]}, "第二步：理论框架评估": {"label": "第二步：理论框架评估", "subQuestions": [{"id": "quant.step2.q5", "label": "5. 文献谱系", "content": "- **作为本文研究起点的文献**:\n  - 习近平在文化传承发展座谈会上的讲话（2023）：提出“用中国道理总结好中国经验，把中国经验提升为中国理论”，直接奠定了本文的研究目标——将国家部委典型案例中的实践解构为理论。\n  - 中共中央办公厅、国务院办公厅《关于建立健全生态产品价值实现机制的意见》（2021）：作为政策文本，提供了“生态产品价值实现”的核心概念和六大机制框架，是本文分析案例的官方依据。\n  - 温铁军、逯浩（2021）《国土空间治理创新与空间生态资源深度价值化》：提出了空间生态资源价值化的理论雏形，本文在此基础上进一步细化为“三层次”生态产品类型。\n\n- **作为本文核心理论框架来源的文献**:\n  - 温铁军、罗士轩、董筱丹、刘亚慧（2018）《乡村振兴背景下生态资源价值实现形式的创新》：提出了生态资源资本化的基本路径，本文将其扩展为“生态赤字恢复—生态价值深化—生态资本深化”三阶段模型。\n  - 欧阳志云等（2013）《生态系统生产总值核算》：提供了GEP核算的理论与方法，本文将其与GDP双向转化作为价值实现的目标。\n  - 温铁军、逯浩（2021）《国土空间治理创新与空间生态资源深度价值化》：再次作为核心框架来源，提供了“生态空间资源”的宏观概念及其“外溢共享”的价值实现逻辑。\n\n- **为本文的分析视角合理性提供依据的文献**:\n  - 李周（2020）《夯实生态文明制度体系 加快生态文明建设进程》：论证了生态文明制度体系对价值实现的支撑作用，为本文强调“系统性顶层设计”提供了合理性。\n  - 中国社会科学院工业经济研究所课题组（2011）《中国工业绿色转型研究》：揭示了GDP导向下的环境代价，为本文提出“生态赤字恢复”阶段的必要性提供了历史依据。\n  - 温铁军、邱建生、车海生（2018）《改革开放40年“三农”问题的演进与乡村振兴战略的提出》：指出了工业化导致的农村生态问题，为本文强调“因地制宜”和“乡村治理”提供了背景。\n\n- **为本文提供重要机制参考的文献**:\n  - 曾贤刚、虞慧怡、谢芳（2014）《生态产品的概念、分类及其市场化供给机制》：提供了生态产品的分类视角（自然要素与公共产品），本文在此基础上批判性地提出了“三层次”分类。\n  - 高晓龙、程会强、郑华、欧阳志云（2019）《生态产品价值实现的政策工具探究》：列举了碳汇、水权等交易工具，本文将其整合为“配额交易”策略。\n  - 逯浩、温铁军（2024）《中国乡村治理现代化转型的战略思考》：提出了GEP与GDP双向转化和扩增的目标，本文将其作为价值实现的最终目标。\n\n- **为本文提供重要的实证方法借鉴的文献**:\n  - 自然资源部办公厅《生态产品价值实现典型案例》（第一批、第三批、第四批）：提供了本文分析的核心案例素材（鄂州、徐州、威海、重庆、杭州、永修、三明、丽水）。\n  - 生态环境部网站《江西永修县探索“候鸟经济”生态产品价值实现路径》：提供了具体案例的操作细节，本文据此归纳出“赋能增值”策略。\n  - 国家发展和改革委员会网站《丽水山耕：品牌溢价下的有效机制》：提供了品牌赋能的实证参考，本文据此分析“生态资本深化”阶段的赋能增值路径。\n  - 逯浩、李海涛、温铁军（2025）《生态共富与乡村振兴：浙江省“千万工程”的实践与启示》：提供了浙江省的实践经验，作为本文“生态资本深化”阶段的补充证据。\n  - 《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（2024）：作为政策文本，为本文的“顶层设计”与“地方实践”互动提供了制度分析依据。"}, {"id": "quant.step2.q6", "label": "6. 理论基础", "content": "核心理论基础是 **“生态产品价值实现的三层次-三阶段-三策略”分析框架**，它整合了公共产品理论、产权理论、外部性理论和资本深化理论。本文的应用如下：\n- **关键要素**:\n  - **生态产品类型**: 宏观层次（生态空间资源）、中观层次（生态公共品）、微观层次（生态消费品）。这是分类维度，基于产权清晰度和公共性程度划分。\n  - **价值显化阶段**: 生态赤字恢复（前期）、生态价值深化（中期）、生态资本深化（后期）。这是时间维度，基于生态资本积累程度划分。\n  - **实践策略**: 外溢共享、配额交易、赋能增值。这是机制维度，基于价值转化方式划分。\n- **分类维度**: 本文通过“类型×阶段×策略”的三维矩阵（见表2），将案例归类，形成分析框架。例如，鄂州案例属于“生态赤字恢复阶段+配额交易路径”。\n- **因果关系作用机制**:\n  - **机制1（政府主导修复）**: 生态赤字 → 政府投资（耐心资本）→ 生态修复 → 生态公共品供给 → 生态价值初步显化（如鄂州的生态补偿）。\n  - **机制2（市场深化）**: 生态公共品 → 计量/确权 → 交易平台（配额交易）→ 价值深化（如重庆的森林覆盖率指标交易）。\n  - **机制3（资本赋能）**: 生态消费品 → 品牌化/技术整合 → 市场溢价 → 资本深化（如丽水的“丽水山耕”）。\n  - **整体逻辑**: 政府通过顶层设计弥补负外部性（阶段1），市场通过制度创新实现价值显化（阶段2），资本通过要素重组实现价值跃迁（阶段3），最终实现GEP与GDP的双向转化。"}, {"id": "quant.step2.q7", "label": "7. 待检验假说", "content": "本文是定性案例研究，未明确列出统计意义上的H1、H2。但基于其理论框架，可提炼出以下隐含的“待检验假说”：\n- **H1（阶段递进假说）**: 生态产品价值实现遵循“生态赤字恢复→生态价值深化→生态资本深化”的阶段性递进路径。即，只有先完成生态修复（阶段1），才能有效推进市场化交易（阶段2），进而实现资本化运营（阶段3）。\n- **H2（策略匹配假说）**: 不同层次的生态产品需要匹配不同的价值实现策略。具体而言：宏观生态空间资源更适合“外溢共享”策略；中观生态公共品更适合“配额交易”策略；微观生态消费品更适合“赋能增值”策略。"}, {"id": "quant.step2.q8", "label": "8. 创新点", "content": "这些假说与前人相比，新在以下方面：\n- **对温铁军等（2018、2021）的改进**: 前人提出了“生态资源资本化”的宏观路径，但未区分阶段。本文创新性地引入“三阶段”模型（阶段1-3），强调了“生态赤字恢复”作为前提条件，避免了“跨阶段”的机械操作（如直接进入资本化而忽视修复）。这是**维度增加**（从单一路径到阶段性路径）。\n- **对曾贤刚等（2014）的改进**: 前人将生态产品分为“自然要素”和“公共产品”，本文批判了这种“泛化”和“单一维度”，提出“三层次”分类（宏观/中观/微观），并引入**产权清晰度**和**可交易性**作为分类标准。这是**视角转换**（从供给属性到产权-市场属性）。\n- **对欧阳志云等（2013）的改进**: 前人聚焦GEP核算，本文将其与GDP转化结合，提出“双向转化和扩增”目标，并引入**“新质生产力”**作为生态资本深化阶段的新要素，强调技术赋能和品牌溢价。这是**新要素引入**（从核算到转化，从生态到技术）。\n- **对高晓龙等（2019）的改进**: 前人列举了多种政策工具，但未系统化。本文将其整合为“外溢共享、配额交易、赋能增值”三大策略，并建立了与“三阶段”的对应关系（见表2），形成了可操作的分析框架。这是**系统化整合**（从工具清单到策略体系）。"}, {"id": "quant.step2.q9", "label": "9. 逻辑推演", "content": "假说背后的微观机制（为什么A会导致B？）：\n- **H1的微观机制**:\n  - **阶段1（生态赤字→价值生成）**: 当生态赤字存在时，生态系统无法提供可交易的公共品或消费品。政府必须投入“耐心资本”（如鄂州的生态补偿、徐州的修复工程），弥补负外部性。这一过程通过**产权模糊性**和**正外部性**机制，使生态恢复成为后续价值化的前提。若不修复，直接开发会导致“次生灾害”和“生态平衡破坏”（本文第16页），无法进入阶段2。\n  - **阶段2（价值深化）**: 恢复后的生态公共品（如森林覆盖率、湿地）具有准公共产品属性。通过政府创造交易需求（如重庆的指标交易），利用**配额交易机制**，将隐性价值显化为可交易指标。这一过程需要**计量技术**（如GEP核算）和**制度创新**（如地役权），否则价值无法被市场识别。\n  - **阶段3（资本深化）**: 当生态资本积累到一定程度，通过**品牌化**（如丽水山耕）和**技术整合**（如碳汇交易平台），降低交易成本，提升产品溢价。这一过程依赖**新质生产力**（如数字化、金融工具），将生态要素转化为可抵押、可证券化的资本品，实现价值跃迁。\n- **H2的微观机制**:\n  - **宏观层次（空间资源）**: 生态空间资源（如山水林田湖草沙）产权边界模糊，正外部性强，无法直接交易。因此，需通过**外溢共享机制**（如用益物权、特许经营权），让多个主体共同开发，利用**多层级市场**（如金融产品）发现价值。若不共享，单一主体无法承担其巨大体量和正外部性。\n  - **中观层次（公共品）**: 生态公共品（如碳汇、水权）具有可计量性，可通过政府设立的**交易平台**进行配额交易。卖方（不发达地区）提供调节服务，买方（发达地区）购买指标，实现**跨区域资源配置**。若不交易，其公共品属性将导致“搭便车”和供给不足。\n  - **微观层次（消费品）**: 生态消费品（如有机农产品）产权清晰，可直接市场交易。通过**生态银行**降低市场风险，提供资本支持，实现**品牌溢价**和**服务标准化**。若不赋能，其价值将被低价锁定在初级产品阶段。"}]}, "第三步：方法论批判": {"label": "第三步：方法论批判", "subQuestions": [{"id": "quant.step3.q10", "label": "10. 数据来源", "content": "该论文的数据来源为**官方发布的典型案例文本**，属于**非公开的独家调研汇编**，而非公开可下载的定量数据集。具体而言：\n- **案例文本来源**：自然资源部、生态环境部与国家发展和改革委员会分批次遴选的“生态产品价值实现典型案例”。\n- **数据性质**：这些案例是政府部门基于地方实践筛选的创新经验总结，以政策文件、通知附件或官方报道形式发布（如《自然资源部办公厅关于印发〈生态产品价值实现典型案例〉的通知》）。\n- **局限性**：论文未提供案例的完整清单、原始数据（如产值、修复面积等定量指标），也未说明案例的遴选标准、时间跨度或地理分布，因此无法进行独立复现或统计检验。"}, {"id": "quant.step3.q11", "label": "11. 获取与清洗", "content": "论文未详细说明数据获取与清洗过程，仅提及通过官方渠道引用了具体案例（如湖北省鄂州市、江苏省徐州市潘安湖等）。具体问题如下：\n- **公开数据**：论文未提供任何数据库下载路径或统计年鉴引用，仅引用政策文件网址（如自然资源部网站）。这些网址指向的是官方通知，而非结构化数据。\n- **调研数据**：未涉及任何一手调研数据。案例文本本身是定性描述，无抽样框、样本量或代表性说明。\n- **文本分析**：未使用任何文本分析工具（如自然语言处理、主题建模等）。论文仅通过人工阅读和归纳的方式，将案例按“生态赤字恢复”“生态价值深化”“生态资本深化”三个阶段分类，并提炼出“外溢共享”“配额交易”“赋能增值”三种策略。这一过程缺乏系统性的编码方案或信效度检验。"}, {"id": "quant.step3.q12", "label": "12. 数据生成的微观结构 (DGP)", "content": "数据生成过程中存在严重的**系统性偏差**，主要源于以下两点：\n- **幸存者偏差**：案例仅包含成功入选部委名单的正面典型，未纳入失败或效果不佳的实践。论文未讨论未入选案例的原因（如政策执行不力、生态修复失败等），导致结论倾向于夸大“中国经验”的有效性。\n- **自选择问题**：地方政府主动申报或部委主动筛选的案例，天然倾向于选择那些符合政策导向、具有宣传价值的实践。这意味着案例本身并非随机样本，而是经过政治和行政过滤的“最佳实践”，无法代表全国生态产品价值实现的普遍状况。例如，论文提到的“浙江丽水山耕”品牌本身即获得大量政策资源倾斜，其成功不可简单外推至其他地区。\n- **缺乏反事实**：论文未提供任何对照组或基准线，无法判断案例中的价值提升在多大程度上归因于政策干预，而非其他因素（如宏观经济周期、技术进步、市场自发演化）。例如，鄂州市的生态补偿机制成功，可能同时受到中央转移支付力度增加的影响，但论文未分离这一效应。"}]}, "第四步：实证结果解读": {"label": "第四步：实证结果解读", "subQuestions": [{"id": "quant.step4.q13", "label": "13. 核心变量定义", "content": "- **Y（因变量）**：生态产品价值实现。具体而言，论文未将Y量化为单一指标，而是将其定义为通过政策干预和市场化机制，使生态资源（如山水林田湖草沙）转化为经济、社会、文化等多元价值的过程。其文献依据主要来自政策文件（如《关于建立健全生态产品价值实现机制的意见》）和学术文献（如欧阳志云等对生态系统生产总值GEP的研究）。\n- **X（核心自变量）**：国家部委遴选的生态产品价值实现典型案例。X并非单一变量，而是三类实践策略（外溢共享、配额交易、赋能增值）和三阶段价值显化路径（生态赤字恢复、生态价值深化、生态资本深化）的复合体。选择依据是自然资源部、生态环境部、国家发改委分批发布的官方案例，文献来源包括温铁军等对生态资源价值化的研究。"}, {"id": "quant.step4.q14", "label": "14. 衡量方式", "content": "- **直接观测 vs 代理变量**：论文未对Y或X进行定量测量，而是采用**定性案例解构**方法。Y的“实现”通过案例描述中的政策效果（如生态修复面积、经济收入增长）间接体现，属于**代理变量**的叙事性替代。\n- **指标构建**：未使用TFP等定量指标。论文提及GEP（生态系统生产总值）和GDP的双向转化，但未给出具体核算公式或算法。案例中部分提及定量数据（如森林覆盖率指标交易、碳汇交易量），但未系统化构建测量体系。"}, {"id": "quant.step4.q15", "label": "15. 控制变量", "content": "- **选择的Z**：论文未明确列出控制变量。在因果推断框架下，论文隐含控制了以下因素：\n  - **地理与资源禀赋**：通过“因地制宜”原则，强调不同地区生态本底差异（如三级阶梯地理格局、气候带），间接控制自然条件异质性。\n  - **制度与政策环境**：通过“系统性顶层设计”和“政府主导”的论述，隐含控制了政策干预强度（如财政转移支付、生态补偿机制）。\n  - **历史路径依赖**：通过“生态赤字恢复阶段”的讨论，控制了前期工业化/城镇化导致的生态破坏程度。\n- **选择依据**：主要基于**供给冲击**（如生态承载力透支）和**制度约束**（如GDP导向的晋升机制），而非需求冲击。论文未使用统计控制方法（如回归分析），而是通过案例选择（如鄂州、徐州、威海等不同阶段案例）实现定性控制。"}, {"id": "quant.step4.q16", "label": "16. 机制分析变量与特殊处理", "content": "- **机制分析变量**：\n  - **中介变量**：未明确使用中介变量，但隐含了“生态产品类型”（生态空间资源、生态公共品、生态消费品）作为价值转化的中间环节。例如，生态赤字恢复阶段通过“政府投资生成生态公共品”，再通过“配额交易”实现价值显化。\n  - **调节变量**：未明确使用调节变量，但“因地制宜”原则实质暗示了**地方自然禀赋**和**产业基础**作为调节因素。例如，同一阶段（如生态价值深化）在不同地区（重庆 vs 浙江杭州）采用不同路径（配额交易 vs 外溢共享）。\n  - **异质性分析**：通过案例分类（三阶段×三路径）实现异质性分析。具体做法是将案例按生态赤字恢复/价值深化/资本深化分组，再按配额交易/外溢共享/赋能增值路径细分。例如，福建省三明市（林权改革）和浙江省丽水市（品牌溢价）同属生态资本深化阶段，但分别对应配额交易和赋能增值路径。\n  - **门槛分析**：未进行统计门槛分析，但隐含了**生态承载力阈值**作为门槛变量。论文指出“不能跨过生态修复阶段直接进入价值转化阶段”，暗示生态赤字程度是价值实现的必要门槛。\n\n- **特殊处理**：\n  - **对数化/去通胀/标准化**：未进行任何定量处理。论文完全采用定性描述，未报告数据来源或统计转换。\n  - **其他处理**：论文对案例进行了**阶段分类**（三阶段）和**策略分类**（三路径），属于定性编码处理，但未说明编码规则或验证信度。"}]}, "第五步：局限性分析": {"label": "第五步：局限性分析", "subQuestions": [{"id": "quant.step5.q17", "label": "17. 计量模型", "content": "本文未设定任何显式的计量回归方程（如 `Y_it = alpha + beta X_it + gamma Z_it + epsilon_it`）。全文采用**定性案例研究**与**理论归纳**的方法，基于国家部委发布的典型案例（如自然资源部、生态环境部、国家发改委的案例库），对生态产品价值实现的路径进行类型学解构。核心分析框架为三阶段（生态赤字恢复、生态价值深化、生态资本深化）与三策略（配额交易、外溢共享、赋能增值）的交叉分类表（见表2），而非统计推断。"}, {"id": "quant.step5.q18", "label": "18. 识别挑战", "content": "由于本文未进行因果推断，传统计量意义上的内生性问题不直接适用。但从逻辑论证角度看，存在以下挑战：\n- **选择性偏差**：案例由官方遴选，可能存在“幸存者偏差”——入选案例均为成功经验，失败或效果不彰的实践未被纳入，导致对“中国经验”的归纳可能高估政策有效性。\n- **反向因果模糊**：论文将生态产品价值实现视为“两山”理念指导下的结果，但实践中可能是地方经济先发展（如浙江丽水），再倒逼生态价值转化，因果方向未加区分。\n- **遗漏变量**：典型案例的成功可能归因于未控制的异质性因素，如地方官员的晋升激励、初始财政能力、地理区位优势（如靠近长三角消费市场），而非纯粹的政策设计。\n- **测量误差**：关键概念如“生态空间资源”“生态公共品”缺乏可操作的量化指标，案例间的比较基于定性描述，无法进行标准化度量。"}, {"id": "quant.step5.q19", "label": "19. 解决策略", "content": "本文未采用任何计量识别策略（如IV、DID、RDD、Bunching）。其论证策略属于**理论驱动的案例比较**：\n- **类型学归纳**：通过将案例按“阶段-策略”二维矩阵分类（表2），构建一个概念性框架，而非检验因果效应。\n- **过程追踪**：对每个案例描述从“生态赤字”到“价值显化”的历史过程，隐含地利用时间序列的逻辑顺序（如先修复、后交易），但未使用反事实分析。\n- **权威性背书**：依赖官方“典型案例”的权威性，替代了实证检验。"}, {"id": "quant.step5.q20", "label": "20. 机制检验", "content": "本文未进行统计意义上的机制检验，但隐含了一个理论机制图谱。基于论文描述，可绘制如下：\n\n```mermaid\ngraph TD\n    X[“两山”理念与顶层制度设计] --> A[政府主导的生态修复投资]\n    A --> B[生态赤字恢复/价值生成]\n    B --> C1[配额交易机制<br/>（碳汇、水权、森林覆盖率指标）]\n    B --> C2[外溢共享机制<br/>（湿地修复、矿坑修复的周边效益）]\n    B --> C3[赋能增值机制<br/>（生态银行、区域品牌如“丽水山耕”）]\n    C1 --> D[生态价值深化<br/>（市场化交易实现经济价值）]\n    C2 --> D\n    C3 --> D\n    D --> E[生态资本深化<br/>（新质生产力、绿色GDP与GEP双增）]\n    E --> Y[人与自然和谐共生的现代化]\n```\n\n**说明**：该图谱中的箭头表示逻辑传导关系，而非统计显著性。核心中介变量（M）为“生态价值显化路径”（配额交易、外溢共享、赋能增值），但论文未提供任何中介效应检验（如Sobel test或Baron & Kenny步骤）。"}, {"id": "quant.step5.q21", "label": "21. 稳健性检验 (Robustness)", "content": "本文未进行任何稳健性检验，原因在于其方法论属性：\n- **识别假设检验**：无。未讨论平行趋势、安慰剂检验或排他性约束。例如，未检验如果某案例（如徐州潘安湖）不进行修复工程，是否仍能实现经济转型（反事实缺失）。\n- **替代性解释排除**：未系统排除竞争性假说。例如，浙江丽水“丽水山耕”品牌的成功，可能主要归因于长三角消费市场的溢出效应和电商渠道（如拼多多、淘宝），而非单纯的“生态资本深化”路径。论文未控制市场区位变量。\n- **异质性分析**：无。论文虽提及“因地制宜”，但未对案例按地理区域（东部vs西部）、发展阶段（发达vs欠发达）或产权结构（集体vs国有）进行分组比较，以检验框架的适用边界。例如，西部生态脆弱区（如青海三江源）的案例未被纳入分析，使得结论的外部有效性存疑。\n\n**总体评价**：本文是一篇优秀的**政策概念化**论文，但作为实证研究，其计量方法论为零。若要在因果推断层面提升，需补充：（1）面板数据回归检验三阶段路径对GEP/GDP比率的效应；（2）利用DID比较试点地区与非试点地区的差异；（3）使用工具变量（如历史降雨量或地形起伏度）处理生态投资的内生性。"}]}, "第六步：实践意义": {"label": "第六步：实践意义", "subQuestions": [{"id": "quant.step6.q22", "label": "22. 结果解读", "content": "本文并非基于计量回归的实证研究，而是对国家部委发布的生态产品价值实现典型案例进行定性解构与理论归纳。因此，不存在传统意义上的“系数估计”或“显著性检验”。然而，从分析逻辑看，本文的核心“结果”可被视为一种**模式识别**与**阶段划分**：\n\n- **核心发现**：生态产品价值实现存在三条主要路径（外溢共享、配额交易、赋能增值），这些路径并非随机分布，而是与生态产品的三个层次（宏观生态空间资源、中观生态公共品、微观生态消费品）以及价值显化的三个阶段（生态赤字恢复、生态价值深化、生态资本深化）存在系统性对应关系。\n- **显著模式**：文中通过9个典型案例（如鄂州、徐州潘安湖、威海、重庆、杭州、永修、三明、丽水）的对比分析，清晰地展示了不同阶段的主导路径。例如，在“生态赤字恢复”阶段，政府主导的“外溢共享”和“配额交易”路径（如鄂州生态补偿、徐州修复工程）表现得最为显著；而在“生态资本深化”阶段，“赋能增值”路径（如丽水山耕品牌）的显著性更强。\n- **不显著或缺失的模式**：作者明确指出，在“生态资本深化”阶段，“外溢共享路径还缺少典型案例”。这一“不显著”的结果具有重要的诊断价值，它暗示了当前实践的瓶颈：即当生态资本已深度市场化后，如何通过制度创新实现其正外部性（如空间生态资源的跨区域、跨产业溢出效应）的进一步显化和交易，仍缺乏成熟的中国经验。"}, {"id": "quant.step6.q23", "label": "23. 评价", "content": "- **经济学含义**：本文的核心经济学含义在于揭示了生态产品价值实现是一个**动态的、分阶段的制度变迁与资本转化过程**。\n  - 它否定了“绿水青山”自动转化为“金山银山”的浪漫主义假设，明确指出这一过程需要经历从“生态赤字修复”（政府投资弥补负外部性）到“生态价值深化”（市场机制引入，界定产权）再到“生态资本深化”（金融化、品牌化）的阶梯式跃迁。\n  - 这一框架与**新制度经济学**的“产权-交易成本-制度变迁”理论高度一致。特别是“配额交易”路径（如碳汇、水权）直接对应了科斯定理（Coase Theorem）中通过明确产权和降低交易成本来解决外部性的思想。而“外溢共享”路径则触及了**公共品供给**与**俱乐部产品**的边界问题。\n- **与理论的一致性**：该结果与**马克思政治经济学**中的“价值转形”理论及**布迪厄（Bourdieu）**的“资本形式转化”理论（经济资本、文化资本、社会资本、象征资本）在逻辑上高度契合。生态产品从“公共品”（无价值形态）到“资源”（潜在价值）再到“资本”（产生剩余价值）的转化，正是资本形态演化的具体体现。\n- **实证假设的满足情况**：本文并非计量研究，因此不涉及计量假设（如条件独立性、排他性约束等）。但其分析隐含了关键假设：**阶段划分具有时序性和因果性**（即必须经历前一阶段才能进入后一阶段）。该假设在案例中得到部分支持（如鄂州必须先修复生态才能谈价值深化），但作者也承认存在“跨过阶段”的失败风险（如跃进式开发农业旅游），这反而强化了其阶段论的说服力。"}, {"id": "quant.step6.q24", "label": "24. 讨论", "content": "- **与主流文献的一致性**：\n  - 本文与**生态经济学**中关于“生态系统服务”（Ecosystem Services）与“自然资本”（Natural Capital）核算的文献（如Costanza et al., 1997; Daily, 1997）在目标上一致，都致力于将自然价值纳入经济系统。但本文更强调**中国语境下的制度驱动**，而非单纯的货币化核算。\n  - 与**发展经济学**中关于“资源诅咒”（Resource Curse）的文献相比，本文提供了反向证据：在中国制度框架下，生态资源（特别是通过政府主导的修复和制度创新）可以成为经济发展的“福音”而非“诅咒”，这挑战了传统“资源诅咒”理论的普适性。\n- **与特定文献的矛盾或补充**：\n  - **与西方“生态现代化”理论的对话**：西方生态现代化理论（如Mol, 1995）强调技术革新与市场机制的自发作用。本文则强调**政府作为“第一推动力”** 在生态修复和制度供给中的核心作用，尤其是在“生态赤字恢复”阶段。这补充了生态现代化理论中关于国家角色的论述，体现了“中国经验”的特殊性。\n  - **对“两山”理论的操作化**：大量关于“两山”理念的文献停留在哲学或政策阐释层面。本文通过构建“三层次-三路径-三阶段”的分析框架，为“两山”理念从宏观理念向具体操作提供了**可检验的分析工具**，这是对现有理论化尝试的重要推进。"}, {"id": "quant.step6.q25", "label": "25. 政策含义", "content": "- **阶段精准施策**：政策制定不应“一刀切”。对于生态严重赤字地区（如资源枯竭型城市），政策重心应是**政府主导的“耐心资本”投入**（如生态修复工程、生态补偿），而非直接追求市场化交易。对于生态基础较好但产业单一地区，政策应聚焦于**产权界定与市场创建**（如碳汇交易、水权交易平台）。对于生态资本已较为发达的地区，政策应着力于**制度创新与赋能**（如区域公共品牌建设、生态金融产品开发）。\n- **警惕“跃迁陷阱”**：政策应避免鼓励地方政府跳过生态修复阶段直接进入价值转化阶段。文中提到的“跃进式开发农业旅游”等失败案例，警示政策设计必须尊重自然规律和阶段性规律。考核机制应引入“生态资产负债表”，对跨阶段冒进行为进行约束。\n- **填补“外溢共享”的制度空白**：当前在生态资本深化阶段，外溢共享路径的案例缺失，意味着**制度供给存在短板**。政策应重点探索如何通过**地役权、用益物权、信托**等制度创新，将大型生态空间（如国家公园、流域）的正外部性（如气候调节、生物多样性）转化为可交易、可抵押的资产，从而吸引社会资本进入。这可能是未来政策创新的蓝海。\n- **新质生产力的结合点**：政策应鼓励将数字技术（如区块链溯源）、生物技术（如生态修复技术）与生态产品价值实现相结合。例如，利用区块链技术解决“丽水山耕”品牌信任问题，利用遥感与AI技术进行更精准的生态资产核算，从而提升“赋能增值”路径的效率和可信度。"}]}, "第七步：未来方向": {"label": "第七步：未来方向", "subQuestions": [{"id": "quant.step7.q26", "label": "26. 致命伤 (The Achilles' Heel)", "content": "这篇文章最大的弱点在于其**因果识别框架的缺失**，以及由此导致的**理论归纳与经验证据之间的脱节**。具体而言：\n\n- **缺乏清晰的因果识别策略**：文章将生态产品价值实现划分为“生态赤字恢复—生态价值深化—生态资本深化”三个时序阶段，并声称案例体现了“配额交易、外溢共享、赋能增值”三种策略。然而，作者并未建立任何反事实分析框架（如DID、RDD、IV或匹配方法）来识别这些策略与生态经济效益之间的**因果效应**。文章实际上是在描述案例中的“事后”相关性，而非识别“事前”的因果机制。例如，鄂州市的生态补偿案例是否真正提升了生态价值，抑或是同期其他政策（如产业转移、环保督察）的叠加效果？文章未做任何排除性检验。\n- **选择性案例偏差与外部有效性存疑**：国家部委遴选的典型案例本身存在严重的**选择偏差**——这些案例是“成功”的、符合政策导向的样本。文章未讨论失败案例或对照组，导致其提出的“中国经验”可能是一种**幸存者偏差**下的叙事。例如，文中批评了“跃进式开发农业旅游产业”和“机械式植树造林”的失败做法，却未将这些失败案例纳入分析框架进行对比，从而无法识别成功的必要条件。\n- **理论构建与经验证据的循环论证**：文章的核心理论框架（三层次生态产品、三阶段路径、三类策略）似乎是从案例中“归纳”出来的，但案例本身又是按照这套框架被“解构”的。这构成了典型的**循环论证**或**过度拟合**问题。例如，将丽水山耕归入“生态资本深化”阶段，但该案例的成功是否真的依赖于“资本深化”的机制，还是更多源于品牌营销、政府补贴或消费者偏好变化？文章缺乏对竞争性解释的排除。\n- **忽略内生性问题**：生态产品价值实现的成功地区（如丽水、三明）往往本身具备较好的生态禀赋和初始经济基础。文章未控制这种**自选择偏误**——是好的生态环境导致了价值实现的成功，还是政策干预本身导致了改善？这类似于“好学生被选入重点班，然后成绩好”的混淆问题。"}, {"id": "quant.step7.q27", "label": "27. 未来选题", "content": "基于本文的因果识别缺陷和理论泛化问题，提出两个具体、可执行的选题方向：\n\n- **选题一：生态产品价值实现政策的因果效应评估——以“绿水青山就是金山银山”实践创新基地建设为准自然实验**\n  - **研究问题**：国家设立的“两山”实践创新基地（作为政策冲击）是否显著提升了县域层面的生态系统生产总值（GEP）与农村居民收入？其作用机制是“生态赤字修复”、“价值深化”还是“资本深化”？\n  - **方法设计**：采用**交错双重差分法（Staggered DID）** 或**合成控制法（SCM）**，以获批“两山”基地的县（市）为处理组，以未获批但生态禀赋相似的邻近县为对照组。利用2000-2025年的卫星遥感数据（如NDVI、夜间灯光）和县域统计年鉴，构建GEP与GDP的双重产出指标。关键识别假设是“平行趋势”，并需通过事件研究法检验政策动态效应。\n  - **理论贡献**：超越本文的案例描述性归纳，为“两山”理念提供严谨的因果证据，并区分不同阶段政策的异质性效果，回应“生态保护是否必然牺牲经济增长”的争论。\n\n- **选题二：生态产品价值实现的“赋能增值”机制：基于多案例比较的定性比较分析（QCA）**\n  - **研究问题**：在成功实现生态产品“赋能增值”（如丽水山耕、威海华夏城）的案例中，哪些条件组合（如政府主导力度、社会资本参与度、品牌建设投入、数字化水平）是产生高经济回报的必要或充分条件？\n  - **方法设计**：收集自然资源部发布的全部典型案例（约30-50个）作为样本，采用**清晰集定性比较分析（csQCA）** 或**模糊集定性比较分析（fsQCA）**。将“生态消费品产值增长率”设为结果变量；条件变量包括：是否存在政府主导的平台（如生态银行）、是否引入第三方认证（如碳标签）、是否建立数字化交易平台、是否具有独特文化符号等。通过布尔代数运算，识别出导致高绩效的“因果路径组合”。\n  - **理论贡献**：解决本文“赋能增值”策略过于笼统的问题，揭示其背后的**条件性因果逻辑**（即“在什么条件下，赋能增值才有效”），为不同禀赋的地区提供可操作的策略选择，而非单一化的“中国经验”叙事。"}]}}}]};
    
    let allPapers = [];
    let selectedPapers = [];
    let selectedSubQuestions = new Set();
    let selectedStep = '';
    let expandedDimensions = new Set();
    
    const STEPS = [
      {{ id: '第一步：核心贡献识别', label: '①核心贡献' }},
      {{ id: '第二步：理论框架评估', label: '②理论框架' }},
      {{ id: '第三步：方法论批判', label: '③方法论' }},
      {{ id: '第四步：实证结果解读', label: '④实证结果' }},
      {{ id: '第五步：局限性分析', label: '⑤局限性' }},
      {{ id: '第六步：实践意义', label: '⑥实践意义' }},
      {{ id: '第七步：未来方向', label: '⑦未来方向' }}
    ];

    function init() {{
      allPapers = DEMO_DATA.papers;
      selectedPapers = allPapers.map(p => p.id);
      renderPaperStrip();
      renderStepStrip();
      selectStep(STEPS[0].id);
    }}

    function renderPaperStrip() {{
      const container = document.getElementById('paperStrip');
      container.innerHTML = allPapers.map(paper => {{
        const isSelected = selectedPapers.includes(paper.id);
        const firstAuthor = paper.authors?.[0] || '';
        const meta = [firstAuthor, paper.year].filter(Boolean).join(', ');
        return `
          <div class="paper-chip ${{isSelected ? 'active' : ''}}" onclick="togglePaper('${{paper.id}}')">
            <div class="paper-chip-title">${{paper.title}}</div>
            <div class="paper-chip-meta">${{meta}} · ${{paper.journal || ''}}</div>
            <div class="paper-chip-check">&#10003;</div>
          </div>
        `;
      }}).join('');
    }}

    function renderStepStrip() {{
      const container = document.getElementById('stepStrip');
      container.innerHTML = STEPS.map(step => `
        <button class="step-badge ${{selectedStep === step.id ? 'active' : ''}}" onclick="selectStep('${{step.id}}')">
          ${{step.label}}
        </button>
      `).join('');
    }}

    function selectStep(stepId) {{
      selectedStep = stepId;
      renderStepStrip();
      updateActionBar();
      if (selectedPapers.length > 0 && selectedStep) {{
        renderDimensions();
      }}
    }}

    function togglePaper(paperId) {{
      const idx = selectedPapers.indexOf(paperId);
      if (idx > -1) {{
        selectedPapers.splice(idx, 1);
      }} else {{
        selectedPapers.push(paperId);
      }}
      renderPaperStrip();
      updateActionBar();
      if (selectedPapers.length > 0 && selectedStep) {{
        renderDimensions();
      }}
    }}

    function renderDimensions() {{
      const container = document.getElementById('contentArea');
      const papers = allPapers.filter(p => selectedPapers.includes(p.id));
      const stepData = papers[0]?.steps?.[selectedStep];
      
      if (!stepData || !stepData.subQuestions) {{
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#128196;</div>
            <div class="empty-text">该步骤下暂无子问题</div>
          </div>
        `;
        return;
      }}

      const subQuestions = stepData.subQuestions;
      
      container.innerHTML = subQuestions.map((sq, idx) => {{
        const questionKey = `[${{selectedStep}}] ${{sq.label}}`;
        const isChecked = selectedSubQuestions.has(questionKey);
        const isExpanded = expandedDimensions.has(sq.id);
        
        const cardsHtml = papers.map(paper => {{
          const paperSq = paper.steps?.[selectedStep]?.subQuestions?.find(q => q.id === sq.id);
          const content = paperSq?.content || '';
          const firstAuthor = paper.authors?.[0] || '';
          const initial = firstAuthor.charAt(0) || '?';
          const meta = [firstAuthor, paper.year].filter(Boolean).join(', ');
          
          return `
            <div class="answer-card">
              <div class="answer-header">
                <div class="answer-avatar">${{initial}}</div>
                <div class="answer-info">
                  <div class="answer-title">${{paper.title}}</div>
                  <div class="answer-meta">${{meta}}</div>
                </div>
              </div>
              <div class="answer-content md-content">
                ${{content ? marked.parse(content) : '<span style="color:var(--text-tertiary);font-style:italic;">（未回答）</span>'}}
              </div>
            </div>
          `;
        }}).join('');

        return `
          <div class="dimension-card ${{isExpanded ? 'expanded' : ''}}">
            <div class="dim-header" onclick="toggleDimension('${{sq.id}}', event)">
              <div class="dim-header-left">
                <div class="dim-check ${{isChecked ? 'checked' : ''}}" onclick="toggleSubQuestion('${{sq.id}}', '${{sq.label}}', event)">
                  <span class="checkmark">&#10003;</span>
                </div>
                <span class="dim-num">${{String(idx + 1).padStart(2, '0')}}</span>
                <span class="dim-title">${{sq.label}}</span>
              </div>
              <span class="dim-arrow">&#9654;</span>
            </div>
            <div class="dim-body">
              <div class="cards-scroll">
                ${{cardsHtml}}
              </div>
            </div>
          </div>
        `;
      }}).join('');
    }}

    function toggleDimension(sqId, event) {{
      if (event.target.closest('.dim-check')) return;
      if (expandedDimensions.has(sqId)) {{
        expandedDimensions.delete(sqId);
      }} else {{
        expandedDimensions.add(sqId);
      }}
      renderDimensions();
    }}

    function toggleSubQuestion(sqId, sqLabel, event) {{
      event.stopPropagation();
      const key = `[${{selectedStep}}] ${{sqLabel}}`;
      if (selectedSubQuestions.has(key)) {{
        selectedSubQuestions.delete(key);
      }} else {{
        selectedSubQuestions.add(key);
      }}
      updateActionBar();
      renderDimensions();
    }}

    function updateActionBar() {{
      const stepLabel = STEPS.find(s => s.id === selectedStep)?.label || '请选择';
      document.getElementById('currentStepName').textContent = `当前步骤：${{stepLabel}}`;
      document.getElementById('selectedCount').textContent = `已选 ${{selectedSubQuestions.size}} 个问题`;
      
      const hasStep = !!selectedStep;
      const hasPapers = selectedPapers.length > 0;
      document.getElementById('btnSelectAll').disabled = !hasStep || !hasPapers;
      document.getElementById('btnClearAll').disabled = selectedSubQuestions.size === 0;
      
      const canSynthesize = selectedPapers.length >= 2 && selectedSubQuestions.size >= 1;
      document.getElementById('btnSynthesis').disabled = !canSynthesize;
    }}

    document.getElementById('btnSelectAll').onclick = function() {{
      if (!selectedStep) return;
      const papers = allPapers.filter(p => selectedPapers.includes(p.id));
      const stepData = papers[0]?.steps?.[selectedStep];
      if (!stepData?.subQuestions) return;
      
      stepData.subQuestions.forEach(sq => {{
        selectedSubQuestions.add(`[${{selectedStep}}] ${{sq.label}}`);
      }});
      updateActionBar();
      renderDimensions();
    }};

    document.getElementById('btnClearAll').onclick = function() {{
      selectedSubQuestions.clear();
      updateActionBar();
      renderDimensions();
    }};

    document.getElementById('btnSynthesis').onclick = function() {{
      document.getElementById('modal').classList.add('active');
      document.getElementById('modalBody').innerHTML = `
        <div style="text-align:center;color:var(--text-tertiary);padding:40px 0;">
          <div style="font-size:40px;margin-bottom:16px;">🤖</div>
          <div style="font-size:15px;font-weight:600;color:var(--text-secondary);">AI 综述生成功能（演示模式）</div>
          <div style="margin-top:8px;">已选择 ${{selectedPapers.length}} 篇文献，${{selectedSubQuestions.size}} 个问题</div>
        </div>
      `;
    }};

    document.getElementById('modalClose').onclick = function() {{
      document.getElementById('modal').classList.remove('active');
    }};
    document.getElementById('modal').onclick = function(e) {{
      if (e.target === document.getElementById('modal')) {{
        document.getElementById('modal').classList.remove('active');
      }}
    }};

    // Drag scroll
    let isDown = false;
    let startX;
    let scrollLeft;

    document.addEventListener('mousedown', (e) => {{
      const container = e.target.closest('.cards-scroll');
      if (!container) return;
      isDown = true;
      startX = e.pageX - container.offsetLeft;
      scrollLeft = container.scrollLeft;
    }});

    document.addEventListener('mouseleave', () => isDown = false);
    document.addEventListener('mouseup', () => isDown = false);
    document.addEventListener('mousemove', (e) => {{
      if (!isDown) return;
      const container = e.target.closest('.cards-scroll');
      if (!container) return;
      e.preventDefault();
      const x = e.pageX - container.offsetLeft;
      const walk = (x - startX) * 1.5;
      container.scrollLeft = scrollLeft - walk;
    }});

    init();
  </script>
</body>
</html>
