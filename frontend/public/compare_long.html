<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对比分析 · 长文本精读</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-canvas: #faf8f5;
      --bg-surface: #ffffff;
      --bg-hover: #f5f2ee;
      --bg-selected: rgba(22, 101, 52, 0.06);
      --bg-warm: #f5efe8;
      --text-primary: #2d2a26;
      --text-secondary: #5c554d;
      --text-tertiary: #9a9188;
      --text-muted: #b5ada5;
      --accent-primary: #166534;
      --accent-primary-hover: #14532d;
      --accent-gold: #b45309;
      --accent-coral: #9f1239;
      --border-light: #ebe7e0;
      --border-medium: #ddd8cf;
      --border-focus: #166534;
      --shadow-sm: 0 1px 3px rgba(45, 42, 38, 0.05);
      --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.08);
      --shadow-lg: 0 12px 32px rgba(45, 42, 38, 0.1);
      --font-title: 'Noto Serif SC', 'Songti SC', serif;
      --font-body: 'Noto Sans SC', -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--bg-canvas); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
    .page-wrapper { max-width: 1400px; margin: 0 auto; padding: 0 24px 80px; }
    .header { padding: 40px 60px; border-bottom: 1px solid var(--border-light); }
    .header h1 { font-family: var(--font-title); font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; letter-spacing: 0.02em; }
    .header .subtitle { font-size: 15px; color: var(--text-secondary); }
    .paper-bar { background: var(--bg-surface); border-radius: 12px; padding: 24px; margin-top: 24px; box-shadow: var(--shadow-sm); }
    .paper-bar-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.08em; }
    .paper-cards { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .paper-cards::-webkit-scrollbar { height: 5px; }
    .paper-cards::-webkit-scrollbar-track { background: transparent; }
    .paper-cards::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }
    .paper-card { min-width: 240px; max-width: 320px; padding: 16px 20px; border-radius: 10px; border: 2px solid var(--border-light); background: var(--bg-surface); cursor: pointer; transition: all 0.25s ease; scroll-snap-align: start; flex-shrink: 0; user-select: none; }
    .paper-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-medium); }
    .paper-card.selected { border-color: var(--accent-primary); background: var(--bg-selected); box-shadow: 0 0 0 1px var(--accent-primary); }
    .paper-card-title { font-family: var(--font-title); font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.45; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .paper-card-meta { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }
    .paper-card-dims { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--accent-primary); background: rgba(22,101,52,0.08); padding: 2px 8px; border-radius: 10px; }
    .dim-nav { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dim-pill { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border-light); background: var(--bg-surface); font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; font-family: var(--font-body); }
    .dim-pill:hover { background: var(--bg-hover); border-color: var(--border-medium); }
    .dim-pill.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .action-bar { margin-top: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 20px; background: var(--bg-surface); border-radius: 10px; box-shadow: var(--shadow-sm); }
    .action-bar-info { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-dim { background: var(--bg-warm); color: var(--accent-gold); }
    .badge-paper { background: rgba(180,83,9,0.08); color: var(--accent-gold); }
    .badge-count { background: rgba(22,101,52,0.08); color: var(--accent-primary); }
    .action-bar-spacer { flex: 1; }
    .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; border: none; font-family: var(--font-body); }
    .btn-outline { background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border-medium); }
    .btn-outline:hover { background: var(--bg-hover); }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover { background: var(--accent-primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; background: var(--accent-primary); }
    .accordion-section { margin-top: 20px; }
    .accordion-item { background: var(--bg-surface); border-radius: 10px; margin-bottom: 12px; box-shadow: var(--shadow-sm); overflow: hidden; }
    .accordion-header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; transition: background 0.15s; user-select: none; }
    .accordion-header:hover { background: var(--bg-hover); }
    .accordion-checkbox { width: 18px; height: 18px; accent-color: var(--accent-primary); cursor: pointer; flex-shrink: 0; }
    .accordion-label { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; }
    .accordion-arrow { font-size: 11px; color: var(--text-tertiary); transition: transform 0.3s ease; flex-shrink: 0; }
    .accordion-item.expanded .accordion-arrow { transform: rotate(180deg); }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
    .accordion-body-inner { padding: 0 20px 20px; }
    .answer-cards-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .answer-cards-scroll::-webkit-scrollbar { height: 5px; }
    .answer-cards-scroll::-webkit-scrollbar-track { background: transparent; }
    .answer-cards-scroll::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }
    .answer-card { min-width: 380px; max-width: 380px; max-height: 500px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border-light); background: var(--bg-canvas); scroll-snap-align: start; flex-shrink: 0; display: flex; flex-direction: column; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .answer-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .answer-card::-webkit-scrollbar { width: 4px; }
    .answer-card::-webkit-scrollbar-track { background: transparent; }
    .answer-card::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
    .answer-card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-light); background: var(--bg-surface); flex-shrink: 0; position: sticky; top: 0; z-index: 1; }
    .answer-card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .answer-card-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
    .answer-card-content { padding: 16px; flex: 1; overflow-y: auto; }
    .answer-card-empty { padding: 40px 16px; text-align: center; color: var(--text-muted); font-style: italic; font-size: 13px; }    .md-content h1,.md-content h2,.md-content h3,.md-content h4,.md-content h5,.md-content h6 { font-family: var(--font-title); color: var(--text-primary); margin: 14px 0 6px; line-height: 1.4; }
    .md-content h1 { font-size: 18px; }
    .md-content h2 { font-size: 16px; }
    .md-content h3 { font-size: 14.5px; }
    .md-content h4 { font-size: 13.5px; }
    .md-content p { margin: 6px 0; font-size: 13px; line-height: 1.75; color: var(--text-secondary); }
    .md-content ul,.md-content ol { margin: 6px 0; padding-left: 20px; font-size: 13px; color: var(--text-secondary); }
    .md-content li { margin: 3px 0; line-height: 1.7; }
    .md-content blockquote { border-left: 3px solid var(--accent-primary); padding: 8px 14px; margin: 10px 0; background: var(--bg-selected); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--text-secondary); }
    .md-content code { font-family: var(--font-code); font-size: 12px; background: var(--bg-warm); padding: 1px 5px; border-radius: 4px; color: var(--accent-coral); }
    .md-content pre { background: #2d2a26; color: #e8e4de; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: var(--font-code); font-size: 12px; line-height: 1.55; }
    .md-content pre code { background: none; color: inherit; padding: 0; border-radius: 0; }
    .md-content .table-wrapper { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
    .md-content table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .md-content th,.md-content td { padding: 7px 10px; border: 1px solid var(--border-light); text-align: left; }
    .md-content th { background: var(--bg-warm); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
    .md-content td { color: var(--text-secondary); }
    .md-content a { color: var(--accent-primary); text-decoration: none; }
    .md-content a:hover { text-decoration: underline; }
    .md-content strong { color: var(--text-primary); font-weight: 600; }
    .md-content hr { border: none; border-top: 1px solid var(--border-light); margin: 14px 0; }
    .md-content img { max-width: 100%; border-radius: 6px; }
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-tertiary); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border-light); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.75s linear infinite; margin-bottom: 14px; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-tertiary); font-size: 14px; }
    .empty-state-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .page-wrapper { padding: 0 12px 40px; }
      .header { padding: 24px 20px; }
      .header h1 { font-size: 22px; }
      .paper-bar { padding: 16px; }
      .paper-card { min-width: 200px; max-width: 280px; }
      .answer-card { min-width: 300px; max-width: 300px; }
      .action-bar { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <h1>&#x5BF9;&#x6BD4;&#x5206;&#x6790; &middot; &#x957F;&#x6587;&#x672C;&#x7CBE;&#x8BFB;</h1>
      <p class="subtitle">&#x9009;&#x62E9;&#x6587;&#x732E;&#x4E0E;&#x7EF4;&#x5EA6;&#xFF0C;&#x6A2A;&#x5411;&#x5BF9;&#x6BD4;&#x957F;&#x6587;&#x672C;&#x7CBE;&#x8BFB;&#x7ED3;&#x679C;</p>
    </header>
    <section class="paper-bar">
      <div class="paper-bar-label">&#x9009;&#x62E9;&#x6587;&#x732E;</div>
      <div class="paper-cards" id="paperCards">
        <div class="loading-state" id="paperLoading">
          <div class="spinner"></div>
          <span>&#x52A0;&#x8F7D;&#x4E2D;...</span>
        </div>
      </div>
    </section>
    <nav class="dim-nav" id="dimNav"></nav>
    <div class="action-bar" id="actionBar" style="display:none">
      <div class="action-bar-info">
        <span class="badge badge-dim" id="badgeDim">&#x5168;&#x90E8;&#x7EF4;&#x5EA6;</span>
        <span class="badge badge-paper" id="badgePaper">0 &#x7BC7;&#x6587;&#x732E;</span>
        <span class="badge badge-count" id="badgeCount">&#x5DF2;&#x9009; 0 &#x4E2A;&#x7EF4;&#x5EA6;</span>
      </div>
      <div class="action-bar-spacer"></div>
      <button class="btn btn-outline" id="btnSelectAll">&#x5168;&#x9009;</button>
      <button class="btn btn-outline" id="btnClear">&#x6E05;&#x7A7A;</button>
      <button class="btn btn-primary" id="btnSynthesis" disabled>AI &#x7EFC;&#x8FF0;</button>
    </div>
    <section class="accordion-section" id="accordionSection"></section>
  </div>
  <script>    var API_URL = 'http://localhost:8001/api/compare-demo/long';
    var st = { papers: [], dims: [], selPapers: new Set(), activePill: 'all', selDims: new Set(), expanded: new Set() };
    var firstRender = true;
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function md2html(raw) {
      var h = marked.parse(raw || '');
      h = h.replace(/<table>/g, '<div class="table-wrapper"><table>');
      h = h.replace(/<\/table>/g, '</table></div>');
      return h;
    }
    function mathRender(el) {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ]
        });
      }
    }
    function uniqueDims(papers) {
      var m = new Map();
      papers.forEach(function(p) {
        (p.dimensions || []).forEach(function(d) {
          if (!m.has(d.id)) m.set(d.id, { id: d.id, label: d.label });
        });
      });
      return Array.from(m.values());
    }
    function renderPaperCards() {
      var c = document.getElementById('paperCards');
      if (!st.papers.length) { c.innerHTML = '<div class="empty-state"><p>\u6682\u65e0\u6587\u732e\u6570\u636e</p></div>'; return; }
      c.innerHTML = st.papers.map(function(p) {
        var sel = st.selPapers.has(p.id);
        var auth = (p.authors || []).slice(0, 3).join(', ');
        var yr = p.year ? ' (' + p.year + ')' : '';
        var dc = p.dimensions ? p.dimensions.length : 0;
        return '<div class="paper-card' + (sel ? ' selected' : '') + '" onclick="togglePaper(\'' + p.id + '\')">'
          + '<div class="paper-card-title">' + esc(p.title || '\u672a\u547d\u540d\u6587\u732e') + '</div>'
          + '<div class="paper-card-meta">' + esc(auth) + yr + '</div>'
          + (dc ? '<span class="paper-card-dims">' + dc + ' \u4e2a\u7ef4\u5ea6</span>' : '')
          + '</div>';
      }).join('');
    }
    function renderDimPills() {
      var c = document.getElementById('dimNav');
      if (!st.dims.length) { c.innerHTML = ''; return; }
      var h = '<button class="dim-pill' + (st.activePill === 'all' ? ' active' : '') + '" onclick="selectPill(\'all\')">\u5168\u90e8</button>';
      st.dims.forEach(function(d) {
        h += '<button class="dim-pill' + (st.activePill === d.id ? ' active' : '') + '" onclick="selectPill(\'' + d.id + '\')">' + esc(d.label) + '</button>';
      });
      c.innerHTML = h;
    }    function answerCard(paper, dim) {
      var dd = null;
      (paper.dimensions || []).forEach(function(d) { if (d.id === dim.id) dd = d; });
      var auth = (paper.authors || []).slice(0, 3).join(', ');
      var yr = paper.year ? ' (' + paper.year + ')' : '';
      var ct = (dd && dd.content && dd.content.trim())
        ? '<div class="answer-card-content md-content">' + md2html(dd.content) + '</div>'
        : '<div class="answer-card-empty">\uff08\u672a\u5305\u542b\u6b64\u7ef4\u5ea6\uff09</div>';
      return '<div class="answer-card"><div class="answer-card-header">'
        + '<div class="answer-card-title">' + esc(paper.title || '\u672a\u547d\u540d\u6587\u732e') + '</div>'
        + '<div class="answer-card-meta">' + esc(auth) + yr + '</div></div>' + ct + '</div>';
    }
    function renderAccordion() {
      var section = document.getElementById('accordionSection');
      if (!st.selPapers.size) {
        section.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\ud83d\udcc4</div><p>\u8bf7\u5148\u9009\u62e9\u6587\u732e\u5f00\u59cb\u5bf9\u6bd4</p></div>';
        return;
      }
      if (!st.dims.length) {
        section.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\ud83d\udccb</div><p>\u6682\u65e0\u7ef4\u5ea6\u6570\u636e</p></div>';
        return;
      }
      var selPapers = st.papers.filter(function(p) { return st.selPapers.has(p.id); });
      var html = '';
      st.dims.forEach(function(dim, i) {
        var exp = st.expanded.has(dim.id);
        var chk = st.selDims.has(dim.id);
        var vis = st.activePill === 'all' || st.activePill === dim.id;
        var anim = firstRender
          ? 'animation:fadeInUp .4s ease both;animation-delay:' + (i * 50) + 'ms;'
          : 'animation:none;';
        html += '<div class="accordion-item' + (exp ? ' expanded' : '') + '" data-dim-id="' + dim.id + '"'
          + ' style="' + anim + (!vis ? 'display:none;' : '') + '">'
          + '<div class="accordion-header" onclick="toggleAccordion(\'' + dim.id + '\',event)">'
          + '<input type="checkbox" class="accordion-checkbox"' + (chk ? ' checked' : '')
          + ' onclick="handleCheckbox(event,\'' + dim.id + '\')">'
          + '<span class="accordion-label">' + esc(dim.label) + '</span>'
          + '<span class="accordion-arrow">\u25bc</span></div>'
          + '<div class="accordion-body"' + (exp ? ' style="max-height:none;"' : '') + '>'
          + '<div class="accordion-body-inner"><div class="answer-cards-scroll">'
          + selPapers.map(function(p) { return answerCard(p, dim); }).join('')
          + '</div></div></div></div>';
      });
      section.innerHTML = html;
      firstRender = false;
      section.querySelectorAll('.md-content').forEach(function(el) { mathRender(el); });
    }
    function updateVisibility() {
      document.querySelectorAll('#accordionSection .accordion-item').forEach(function(item) {
        var did = item.getAttribute('data-dim-id');
        item.style.display = (st.activePill === 'all' || st.activePill === did) ? '' : 'none';
      });
    }    function updateActionBar() {
      var dl = st.activePill === 'all'
        ? '\u5168\u90e8\u7ef4\u5ea6'
        : (st.dims.find(function(d) { return d.id === st.activePill; }) || {}).label || '\u5168\u90e8\u7ef4\u5ea6';
      document.getElementById('badgeDim').textContent = dl;
      document.getElementById('badgePaper').textContent = st.selPapers.size + ' \u7bc7\u6587\u732e';
      document.getElementById('badgeCount').textContent = '\u5df2\u9009 ' + st.selDims.size + ' \u4e2a\u7ef4\u5ea6';
      document.getElementById('btnSynthesis').disabled = !(st.selPapers.size >= 2 && st.selDims.size >= 1);
    }
    function togglePaper(id) {
      if (st.selPapers.has(id)) st.selPapers.delete(id); else st.selPapers.add(id);
      renderPaperCards(); renderAccordion(); updateActionBar();
    }
    function selectPill(id) {
      st.activePill = id; renderDimPills();
      var section = document.getElementById('accordionSection');
      if (section.querySelector('.accordion-item')) updateVisibility();
      else renderAccordion();
      updateActionBar();
    }
    function handleCheckbox(e, dimId) {
      e.stopPropagation();
      if (st.selDims.has(dimId)) st.selDims.delete(dimId); else st.selDims.add(dimId);
      updateActionBar();
    }
    function toggleAccordion(dimId, e) {
      if (e.target.type === 'checkbox') return;
      var item = document.querySelector('[data-dim-id="' + dimId + '"]');
      if (!item) return;
      var body = item.querySelector('.accordion-body');
      if (st.expanded.has(dimId)) {
        st.expanded.delete(dimId);
        body.style.maxHeight = body.scrollHeight + 'px';
        body.offsetHeight;
        body.style.maxHeight = '0';
        item.classList.remove('expanded');
      } else {
        st.expanded.add(dimId);
        item.classList.add('expanded');
        body.style.maxHeight = body.scrollHeight + 'px';
        var done = function() { body.style.maxHeight = 'none'; body.removeEventListener('transitionend', done); };
        body.addEventListener('transitionend', done);
      }
    }
    document.getElementById('btnSelectAll').addEventListener('click', function() {
      var dims = st.activePill === 'all'
        ? st.dims
        : st.dims.filter(function(d) { return d.id === st.activePill; });
      dims.forEach(function(d) {
        st.selDims.add(d.id);
        var cb = document.querySelector('[data-dim-id="' + d.id + '"] .accordion-checkbox');
        if (cb) cb.checked = true;
      });
      updateActionBar();
    });
    document.getElementById('btnClear').addEventListener('click', function() {
      st.selDims.clear();
      document.querySelectorAll('.accordion-checkbox').forEach(function(cb) { cb.checked = false; });
      updateActionBar();
    });
    document.getElementById('btnSynthesis').addEventListener('click', function() {
      alert('AI \u7efc\u8ff0\u529f\u80fd\uff08Demo \u6a21\u5f0f\u4e0b\u6682\u4e0d\u53ef\u7528\uff09');
    });
    (async function init() {
      try {
        var res = await fetch(API_URL);
        var data = await res.json();
        st.papers = data.papers || [];
        st.dims = uniqueDims(st.papers);
        renderPaperCards(); renderDimPills(); renderAccordion(); updateActionBar();
        document.getElementById('actionBar').style.display = 'flex';
      } catch (err) {
        document.getElementById('paperCards').innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">\u26a0\ufe0f</div>'
          + '<p>\u52a0\u8f7d\u5931\u8d25: ' + esc(err.message) + '</p></div>';
      }
    })();
  </script>
</body>
