<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比分析 · 七步精读</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
:root {
  --bg-canvas: #faf8f5;
  --bg-surface: #ffffff;
  --bg-hover: #f5f2ee;
  --bg-selected: rgba(22, 101, 52, 0.06);
  --bg-warm: #f5efe8;
  --text-primary: #2d2a26;
  --text-secondary: #5c554d;
  --text-tertiary: #9a9188;
  --text-muted: #b5ada5;
  --accent-primary: #166534;
  --accent-primary-hover: #14532d;
  --accent-gold: #b45309;
  --accent-coral: #9f1239;
  --border-light: #ebe7e0;
  --border-medium: #ddd8cf;
  --border-focus: #166534;
  --shadow-sm: 0 1px 3px rgba(45, 42, 38, 0.05);
  --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.08);
  --shadow-lg: 0 12px 32px rgba(45, 42, 38, 0.1);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-canvas);
  color: var(--text-primary);
  line-height: 1.7;
  min-height: 100vh;
}
.page-header {
  padding: 40px 60px 32px;
  animation: fadeInUp 0.5s ease both;
}
.page-header h1 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-weight: 700;
  font-size: 28px;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}
.page-header .subtitle {
  margin-top: 8px;
  font-size: 14px;
  color: var(--text-tertiary);
}
.paper-selection-bar {
  margin: 0 60px 20px;
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  animation: fadeInUp 0.5s ease 0.1s both;
}
.paper-selection-bar .bar-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.paper-selection-bar .bar-label .count-badge {
  font-weight: 500;
  font-size: 12px;
  background: var(--bg-selected);
  color: var(--accent-primary);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}
.paper-cards-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) transparent;
}
.paper-cards-scroll::-webkit-scrollbar { height: 4px; }
.paper-cards-scroll::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
.paper-card {
  flex: 0 0 auto;
  min-width: 240px;
  max-width: 320px;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-light);
  background: var(--bg-surface);
  cursor: pointer;
  transition: all 0.25s ease;
  user-select: none;
}
.paper-card:hover {
  border-color: var(--border-medium);
  background: var(--bg-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.paper-card.selected {
  border-color: var(--accent-primary);
  background: var(--bg-selected);
  box-shadow: 0 0 0 1px var(--accent-primary);
}
.paper-card .card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}
.paper-card .card-meta {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-tertiary);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.paper-card .card-check {
  float: right;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border-medium);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  margin-top: 2px;
}
.paper-card.selected .card-check {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
}
.paper-card.selected .card-check::after {
  content: '';
  width: 5px;
  height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.step-navigation {
  margin: 0 60px 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  animation: fadeInUp 0.5s ease 0.15s both;
}
.step-pill {
  padding: 8px 18px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-light);
  background: var(--bg-surface);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.step-pill:hover {
  background: var(--bg-hover);
  border-color: var(--border-medium);
}
.step-pill.active {
  background: var(--accent-primary);
  color: white;
  border-color: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(22, 101, 52, 0.25);
}
.action-bar {
  margin: 0 60px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm);
  animation: fadeInUp 0.5s ease 0.2s both;
}
.action-bar .step-name {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
}
.action-bar .selection-count {
  font-size: 12px;
  color: var(--text-tertiary);
  padding: 3px 10px;
  background: var(--bg-warm);
  border-radius: var(--radius-full);
}
.action-bar .spacer { flex: 1; }
.btn {
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--border-light);
  background: var(--bg-surface);
  color: var(--text-secondary);
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-medium); }
.btn-primary {
  background: var(--accent-primary);
  color: white;
  border-color: var(--accent-primary);
}
.btn-primary:hover { background: var(--accent-primary-hover); }
.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.accordion-list {
  margin: 0 60px 60px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.accordion-item {
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  overflow: hidden;
  transition: box-shadow 0.25s ease;
}
.accordion-item:hover { box-shadow: var(--shadow-sm); }
.accordion-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.accordion-header:hover { background: var(--bg-hover); }
.accordion-header .checkbox-wrapper {
  position: relative;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.accordion-header .checkbox-wrapper input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  z-index: 1;
}
.accordion-header .checkbox-visual {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border-medium);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  pointer-events: none;
}
.accordion-header .checkbox-wrapper input:checked + .checkbox-visual {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
}
.accordion-header .checkbox-wrapper input:checked + .checkbox-visual::after {
  content: '';
  width: 5px;
  height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.accordion-header .question-label {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}
.accordion-header .expand-arrow {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease;
  color: var(--text-tertiary);
}
.accordion-item.open .accordion-header .expand-arrow {
  transform: rotate(180deg);
}
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.accordion-item.open .accordion-body {
  max-height: 600px;
}
.accordion-body-inner {
  padding: 4px 20px 20px;
}
.answer-cards-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) transparent;
}
.answer-cards-scroll::-webkit-scrollbar { height: 4px; }
.answer-cards-scroll::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
.answer-card {
  flex: 0 0 380px;
  max-height: 500px;
  overflow-y: auto;
  padding: 18px 20px;
  background: var(--bg-canvas);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) transparent;
  transition: transform 0.2s, box-shadow 0.2s;
}
.answer-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.answer-card::-webkit-scrollbar { width: 4px; }
.answer-card::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
.answer-card .card-paper-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-primary);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-light);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.answer-card .card-content {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-secondary);
}
.answer-card .card-content p { margin-bottom: 10px; }
.answer-card .card-content p:last-child { margin-bottom: 0; }
.answer-card .card-content h1,
.answer-card .card-content h2,
.answer-card .card-content h3,
.answer-card .card-content h4 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  color: var(--text-primary);
  margin: 14px 0 8px;
  font-weight: 600;
}
.answer-card .card-content h1 { font-size: 16px; }
.answer-card .card-content h2 { font-size: 15px; }
.answer-card .card-content h3 { font-size: 14px; }
.answer-card .card-content h4 { font-size: 13px; }
.answer-card .card-content ul,
.answer-card .card-content ol {
  padding-left: 20px;
  margin-bottom: 10px;
}
.answer-card .card-content li { margin-bottom: 4px; }
.answer-card .card-content blockquote {
  border-left: 3px solid var(--accent-primary);
  padding: 6px 14px;
  margin: 10px 0;
  background: var(--bg-selected);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.answer-card .card-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--bg-warm);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent-gold);
}
.answer-card .card-content pre {
  background: var(--bg-warm);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.6;
}
.answer-card .card-content pre code {
  background: none;
  padding: 0;
  color: var(--text-primary);
}
.answer-card .card-content .table-wrapper {
  overflow-x: auto;
  margin: 10px 0;
}
.answer-card .card-content table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.answer-card .card-content th,
.answer-card .card-content td {
  padding: 6px 10px;
  border: 1px solid var(--border-light);
  text-align: left;
}
.answer-card .card-content th {
  background: var(--bg-warm);
  font-weight: 600;
  color: var(--text-primary);
}
.answer-card .card-content strong { color: var(--text-primary); }
.answer-card .card-content a {
  color: var(--accent-primary);
  text-decoration: none;
}
.answer-card .card-content a:hover { text-decoration: underline; }
.answer-card .card-content .katex-display {
  margin: 10px 0;
  overflow-x: auto;
}
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-tertiary);
  animation: fadeInUp 0.5s ease both;
}
.empty-state .empty-icon {
  font-size: 40px;
  margin-bottom: 16px;
  opacity: 0.5;
}
.empty-state .empty-text { font-size: 15px; }
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 60px;
  color: var(--text-tertiary);
  font-size: 14px;
  animation: fadeInUp 0.4s ease both;
}
.loading-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-medium);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.error-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--accent-coral);
  animation: fadeInUp 0.4s ease both;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }
.accordion-item { animation: fadeInUp 0.4s ease both; }
.accordion-item:nth-child(1) { animation-delay: 0.02s; }
.accordion-item:nth-child(2) { animation-delay: 0.04s; }
.accordion-item:nth-child(3) { animation-delay: 0.06s; }
.accordion-item:nth-child(4) { animation-delay: 0.08s; }
.accordion-item:nth-child(5) { animation-delay: 0.10s; }
.accordion-item:nth-child(6) { animation-delay: 0.12s; }
.accordion-item:nth-child(7) { animation-delay: 0.14s; }
.accordion-item:nth-child(8) { animation-delay: 0.16s; }
.accordion-item:nth-child(9) { animation-delay: 0.18s; }
.accordion-item:nth-child(10) { animation-delay: 0.20s; }
@media (max-width: 900px) {
  .page-header, .paper-selection-bar, .step-navigation, .action-bar, .accordion-list {
    margin-left: 20px;
    margin-right: 20px;
  }
  .page-header { padding: 24px 20px 20px; }
  .answer-card { flex: 0 0 300px; }
}
</style>
</head>
<body>
<header class="page-header">
  <h1>对比分析 · 七步精读</h1>
  <p class="subtitle">选择论文与步骤，横向对比各篇精读结果</p>
</header>
<section class="paper-selection-bar" id="paperBar">
  <div class="bar-label">
    选择论文
    <span class="count-badge" id="paperCount">0 篇</span>
  </div>
  <div class="paper-cards-scroll" id="paperCards"></div>
</section>
<nav class="step-navigation" id="stepNav"></nav>
<div class="action-bar" id="actionBar" style="display:none;">
  <span class="step-name" id="actionStepName"></span>
  <span class="selection-count" id="actionSelCount">已选 0 项</span>
  <span class="spacer"></span>
  <button class="btn" id="btnSelectAll" type="button">当前步骤全选</button>
  <button class="btn" id="btnClear" type="button">清空选择</button>
  <button class="btn btn-primary" id="btnSynthesis" type="button" disabled>生成 AI 综述</button>
</div>
<main class="accordion-list" id="accordionList">
  <div class="empty-state">
    <div class="empty-icon">&#128218;</div>
    <p class="empty-text">请先选择论文，然后选择步骤开始对比</p>
  </div>
</main>
<script>
(function() {
  var API_URL = 'http://localhost:8001/api/compare-demo/quant';
  var STEP_KEYS = [
    '第一步：核心贡献识别',
    '第二步：理论框架评估',
    '第三步：方法论批判',
    '第四步：实证结果解读',
    '第五步：局限性分析',
    '第六步：实践意义',
    '第七步：未来方向'
  ];
  var STEP_PILLS = [
    { key: '__all__', label: '全部' },
    { key: STEP_KEYS[0], label: '①核心贡献' },
    { key: STEP_KEYS[1], label: '②理论框架' },
    { key: STEP_KEYS[2], label: '③方法论' },
    { key: STEP_KEYS[3], label: '④实证结果' },
    { key: STEP_KEYS[4], label: '⑤局限性' },
    { key: STEP_KEYS[5], label: '⑥实践意义' },
    { key: STEP_KEYS[6], label: '⑦未来方向' }
  ];
  var papers = [];
  var selectedPaperIds = new Set();
  var currentStep = STEP_KEYS[0];
  var selectedSubQIds = new Set();
  var openAccordions = new Set();
  function loadData() {
    showLoading();
    fetch(API_URL)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        papers = data.papers || [];
        renderPaperCards();
        renderStepNav();
        selectStep(currentStep);
      })
      .catch(function(err) {
        showError('数据加载失败：' + err.message);
      });
  }
  function showLoading() {
    document.getElementById('accordionList').innerHTML =
      '<div class="loading-state"><div class="loading-spinner"></div>加载中...</div>';
  }
  function showError(msg) {
    document.getElementById('accordionList').innerHTML =
      '<div class="error-state">' + escapeHtml(msg) + '</div>';
  }
  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function renderPaperCards() {
    var container = document.getElementById('paperCards');
    if (papers.length === 0) {
      container.innerHTML = '<div class="empty-state"><p class="empty-text">暂无论文数据</p></div>';
      return;
    }
    container.innerHTML = papers.map(function(p, i) {
      var sel = selectedPaperIds.has(p.id) ? ' selected' : '';
      var authors = (p.authors || []).slice(0, 3).join(', ');
      if ((p.authors || []).length > 3) authors += ' 等';
      var metaParts = [];
      if (p.year) metaParts.push(p.year);
      if (p.journal) metaParts.push(p.journal);
      return '<div class="paper-card' + sel + '" data-id="' + p.id + '" onclick="window.__togglePaper(\'' + p.id + '\')">' +
        '<div class="card-check"></div>' +
        '<div class="card-title">' + escapeHtml(p.title || '无标题') + '</div>' +
        '<div class="card-meta">' +
          (authors ? '<span>' + escapeHtml(authors) + '</span>' : '') +
          (metaParts.length ? '<span>' + escapeHtml(metaParts.join(' · ')) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    updatePaperCount();
  }
  window.__togglePaper = function(id) {
    if (selectedPaperIds.has(id)) selectedPaperIds.delete(id);
    else selectedPaperIds.add(id);
    renderPaperCards();
    renderAccordion();
    updateActionBar();
  };
  function updatePaperCount() {
    document.getElementById('paperCount').textContent = selectedPaperIds.size + ' 篇';
  }
  function renderStepNav() {
    var nav = document.getElementById('stepNav');
    nav.innerHTML = STEP_PILLS.map(function(s) {
      var active = s.key === currentStep ? ' active' : '';
      return '<button class="step-pill' + active + '" data-step="' + s.key + '" onclick="window.__selectStep(\'' + s.key.replace(/'/g, "\\'") + '\')">' + s.label + '</button>';
    }).join('');
  }
  window.__selectStep = function(key) {
    currentStep = key;
    renderStepNav();
    renderAccordion();
    updateActionBar();
  };
  function selectStep(key) {
    currentStep = key;
    renderStepNav();
    renderAccordion();
    updateActionBar();
  }
  function getStepsToRender() {
    if (currentStep === '__all__') return STEP_KEYS;
    return [currentStep];
  }
  function renderAccordion() {
    var list = document.getElementById('accordionList');
    var selectedPapers = papers.filter(function(p) { return selectedPaperIds.has(p.id); });
    if (selectedPapers.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128218;</div><p class="empty-text">请先选择论文，然后选择步骤开始对比</p></div>';
      document.getElementById('actionBar').style.display = 'none';
      return;
    }
    document.getElementById('actionBar').style.display = 'flex';
    var steps = getStepsToRender();
    var html = '';
    for (var si = 0; si < steps.length; si++) {
      var stepKey = steps[si];
      var stepLabel = stepKey;
      for (var pi = 0; pi < papers.length; pi++) {
        if (papers[pi].steps && papers[pi].steps[stepKey]) {
          stepLabel = papers[pi].steps[stepKey].label || stepKey;
          break;
        }
      }
      var subQuestions = getSubQuestionsForStep(selectedPapers, stepKey);
      if (subQuestions.length === 0) continue;
      for (var qi = 0; qi < subQuestions.length; qi++) {
        var sq = subQuestions[qi];
        var isOpen = openAccordions.has(sq.id);
        var isChecked = selectedSubQIds.has(sq.id);
        html += '<div class="accordion-item' + (isOpen ? ' open' : '') + '" data-sqid="' + sq.id + '">';
        html += '<div class="accordion-header" onclick="window.__toggleAccordion(\'' + sq.id + '\')">';
        html += '<div class="checkbox-wrapper" onclick="event.stopPropagation()">';
        html += '<input type="checkbox"' + (isChecked ? ' checked' : '') + ' onchange="window.__toggleCheck(\'' + sq.id + '\', this.checked)">';
        html += '<div class="checkbox-visual"></div>';
        html += '</div>';
        html += '<span class="question-label">' + escapeHtml(sq.label) + '</span>';
        html += '<span class="expand-arrow">&#9662;</span>';
        html += '</div>';
        html += '<div class="accordion-body"><div class="accordion-body-inner">';
        html += '<div class="answer-cards-scroll">';
        for (var ppi = 0; ppi < selectedPapers.length; ppi++) {
          var paper = selectedPapers[ppi];
          var content = getSubQuestionContent(paper, stepKey, sq.id);
          if (content === null) continue;
          html += '<div class="answer-card">';
          html += '<div class="card-paper-title">' + escapeHtml(paper.title || '无标题') + '</div>';
          html += '<div class="card-content">' + renderMarkdown(content) + '</div>';
          html += '</div>';
        }
        html += '</div></div></div></div>';
      }
    }
    if (!html) {
      html = '<div class="empty-state"><div class="empty-icon">&#128203;</div><p class="empty-text">当前步骤下没有可对比的内容</p></div>';
    }
    list.innerHTML = html;
    renderMathInContent();
  }
  function getSubQuestionsForStep(selectedPapers, stepKey) {
    var seen = {};
    var result = [];
    for (var i = 0; i < selectedPapers.length; i++) {
      var step = selectedPapers[i].steps && selectedPapers[i].steps[stepKey];
      if (!step || !step.subQuestions) continue;
      for (var j = 0; j < step.subQuestions.length; j++) {
        var sq = step.subQuestions[j];
        if (!seen[sq.id]) {
          seen[sq.id] = true;
          result.push(sq);
        }
      }
    }
    return result;
  }
  function getSubQuestionContent(paper, stepKey, subQId) {
    var step = paper.steps && paper.steps[stepKey];
    if (!step || !step.subQuestions) return null;
    for (var i = 0; i < step.subQuestions.length; i++) {
      if (step.subQuestions[i].id === subQId) {
        return step.subQuestions[i].content || null;
      }
    }
    return null;
  }
  function renderMarkdown(text) {
    if (!text) return '';
    try {
      return marked.parse(text);
    } catch(e) {
      return escapeHtml(text);
    }
  }
  function renderMathInContent() {
    var cards = document.querySelectorAll('.card-content');
    for (var i = 0; i < cards.length; i++) {
      try {
        renderMathInElement(cards[i], {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      } catch(e) {}
    }
  }
  window.__toggleAccordion = function(sqId) {
    if (openAccordions.has(sqId)) openAccordions.delete(sqId);
    else openAccordions.add(sqId);
    renderAccordion();
  };
  window.__toggleCheck = function(sqId, checked) {
    if (checked) selectedSubQIds.add(sqId);
    else selectedSubQIds.delete(sqId);
    updateActionBar();
  };
  function updateActionBar() {
    var bar = document.getElementById('actionBar');
    if (selectedPaperIds.size === 0) {
      bar.style.display = 'none';
      return;
    }
    bar.style.display = 'flex';
    var stepName = currentStep === '__all__' ? '全部步骤' : currentStep;
    document.getElementById('actionStepName').textContent = stepName;
    document.getElementById('actionSelCount').textContent = '已选 ' + selectedSubQIds.size + ' 项';
    var canSynth = selectedPaperIds.size >= 2 && selectedSubQIds.size >= 1;
    document.getElementById('btnSynthesis').disabled = !canSynth;
  }
  document.getElementById('btnSelectAll').addEventListener('click', function() {
    var selectedPapers = papers.filter(function(p) { return selectedPaperIds.has(p.id); });
    var steps = getStepsToRender();
    for (var si = 0; si < steps.length; si++) {
      var stepKey = steps[si];
      for (var pi = 0; pi < selectedPapers.length; pi++) {
        var step = selectedPapers[pi].steps && selectedPapers[pi].steps[stepKey];
        if (!step || !step.subQuestions) continue;
        for (var qi = 0; qi < step.subQuestions.length; qi++) {
          selectedSubQIds.add(step.subQuestions[qi].id);
        }
      }
    }
    renderAccordion();
    updateActionBar();
  });
  document.getElementById('btnClear').addEventListener('click', function() {
    selectedSubQIds.clear();
    renderAccordion();
    updateActionBar();
  });
  document.getElementById('btnSynthesis').addEventListener('click', function() {
    if (selectedPaperIds.size < 2 || selectedSubQIds.size < 1) return;
    alert('AI 综述功能将在后续版本中提供。\n已选 ' + selectedPaperIds.size + ' 篇论文，' + selectedSubQIds.size + ' 个子问题。');
  });
  loadData();
})();
</script>
</body>
</html>
