<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比分析 · 四步精读</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg-canvas: #faf8f5;
  --bg-surface: #ffffff;
  --bg-hover: #f5f2ee;
  --bg-selected: rgba(22, 101, 52, 0.06);
  --bg-warm: #f5efe8;
  --text-primary: #2d2a26;
  --text-secondary: #5c554d;
  --text-tertiary: #9a9188;
  --text-muted: #b5ada5;
  --accent-primary: #166534;
  --accent-primary-hover: #14532d;
  --accent-gold: #b45309;
  --accent-coral: #9f1239;
  --border-light: #ebe7e0;
  --border-medium: #ddd8cf;
  --border-focus: #166534;
  --shadow-sm: 0 1px 3px rgba(45, 42, 38, 0.05);
  --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.08);
  --shadow-lg: 0 12px 32px rgba(45, 42, 38, 0.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg-canvas);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}
.header {
  padding: 40px 60px 32px;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-surface);
}
.header h1 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}
.header .subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 8px;
}
.main { padding: 32px 60px 80px; max-width: 1600px; margin: 0 auto; }

.paper-section {
  background: var(--bg-surface);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
}
.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}
.paper-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scroll-behavior: smooth;
}
.paper-scroll::-webkit-scrollbar { height: 4px; }
.paper-scroll::-webkit-scrollbar-track { background: transparent; }
.paper-scroll::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }
.paper-card {
  min-width: 240px;
  max-width: 320px;
  flex: 0 0 auto;
  padding: 14px 18px;
  border-radius: 10px;
  border: 2px solid var(--border-light);
  background: var(--bg-surface);
  cursor: pointer;
  transition: all 0.25s ease;
  user-select: none;
}
.paper-card:hover {
  border-color: var(--border-medium);
  background: var(--bg-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.paper-card.selected {
  border-color: var(--accent-primary);
  background: var(--bg-selected);
  box-shadow: 0 0 0 1px var(--accent-primary);
}
.paper-card .paper-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.paper-card.selected .paper-title { color: var(--accent-primary); }
.paper-card .paper-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 6px;
}

.step-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.step-pill {
  padding: 8px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--border-light);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.step-pill:hover {
  background: var(--bg-hover);
  border-color: var(--border-medium);
}
.step-pill.active {
  background: var(--accent-primary);
  color: #fff;
  border-color: var(--accent-primary);
}

.action-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.action-bar .step-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.action-bar .count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--bg-selected);
  color: var(--accent-primary);
  font-size: 13px;
  font-weight: 600;
}
.action-bar .spacer { flex: 1; }
.btn-secondary {
  padding: 7px 16px;
  border-radius: 8px;
  border: 1px solid var(--border-medium);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.btn-secondary:hover { background: var(--bg-hover); }
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary {
  padding: 9px 24px;
  border-radius: 10px;
  border: none;
  background: var(--accent-primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(22, 101, 52, 0.25);
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.accordion-list { display: flex; flex-direction: column; gap: 10px; }
.accordion-item {
  background: var(--bg-surface);
  border-radius: 10px;
  border: 1px solid var(--border-light);
  overflow: hidden;
  transition: box-shadow 0.25s ease;
}
.accordion-item:hover { box-shadow: var(--shadow-sm); }
.accordion-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s ease;
}
.accordion-header:hover { background: var(--bg-hover); }
.accordion-header input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent-primary);
  cursor: pointer;
  flex-shrink: 0;
}
.accordion-header .subq-label {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.accordion-header .step-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-primary);
  background: var(--bg-selected);
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.accordion-arrow {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s ease;
  color: var(--text-muted);
  flex-shrink: 0;
}
.accordion-item.open .accordion-arrow { transform: rotate(180deg); }
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.accordion-item.open .accordion-body {
  max-height: 2000px;
}
.answer-scroll {
  display: flex;
  gap: 16px;
  padding: 16px 18px 18px;
  overflow-x: auto;
  scroll-behavior: smooth;
}
.answer-scroll::-webkit-scrollbar { height: 4px; }
.answer-scroll::-webkit-scrollbar-track { background: transparent; }
.answer-scroll::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }
.answer-card {
  min-width: 380px;
  max-width: 420px;
  flex: 0 0 auto;
  max-height: 500px;
  border-radius: 8px;
  border: 1px solid var(--border-light);
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.answer-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.answer-card-header {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.answer-card-header .card-paper-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.answer-card-header .card-paper-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 3px;
}
.answer-card-body {
  padding: 14px 16px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.75;
  color: var(--text-secondary);
  flex: 1;
  user-select: text;
}
.answer-card-body::-webkit-scrollbar { width: 4px; }
.answer-card-body::-webkit-scrollbar-track { background: transparent; }
.answer-card-body::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }
.answer-card-body h1, .answer-card-body h2, .answer-card-body h3, .answer-card-body h4 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  color: var(--text-primary);
  margin: 16px 0 8px;
  line-height: 1.4;
}
.answer-card-body h1 { font-size: 18px; }
.answer-card-body h2 { font-size: 16px; }
.answer-card-body h3 { font-size: 15px; }
.answer-card-body p { margin: 8px 0; }
.answer-card-body ul, .answer-card-body ol { padding-left: 20px; margin: 8px 0; }
.answer-card-body li { margin: 4px 0; }
.answer-card-body strong { color: var(--text-primary); font-weight: 600; }
.answer-card-body em { color: var(--accent-gold); font-style: italic; }
.answer-card-body blockquote {
  border-left: 3px solid var(--accent-primary);
  padding: 8px 16px;
  margin: 10px 0;
  background: var(--bg-selected);
  border-radius: 0 6px 6px 0;
  color: var(--text-secondary);
}
.answer-card-body code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg-warm);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent-coral);
}
.answer-card-body pre {
  background: var(--bg-warm);
  padding: 12px 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.6;
}
.answer-card-body pre code { background: none; padding: 0; color: var(--text-primary); }
.table-wrapper {
  overflow-x: auto;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid var(--border-light);
}
.answer-card-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.answer-card-body th {
  background: var(--bg-warm);
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-medium);
  white-space: nowrap;
}
.answer-card-body td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-secondary);
}
.answer-card-body a { color: var(--accent-primary); text-decoration: none; }
.answer-card-body a:hover { text-decoration: underline; }
.answer-empty {
  color: var(--text-muted);
  font-style: italic;
  font-size: 13px;
  padding: 20px 16px;
  text-align: center;
}

.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 60px 20px;
  color: var(--text-tertiary);
  font-size: 15px;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-light);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.6; }
.empty-state p { font-size: 15px; }

.error-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--accent-coral);
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45, 42, 38, 0.45);
  z-index: 100;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-surface);
  border-radius: 16px;
  width: 92%;
  max-width: 900px;
  max-height: 82vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.25s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.97) translateY(10px); } }
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}
.modal-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-muted);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-secondary); }
.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-secondary);
}
.modal-body h1, .modal-body h2, .modal-body h3 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  color: var(--text-primary);
  margin: 20px 0 10px;
}
.modal-body h2 { font-size: 18px; }
.modal-body h3 { font-size: 16px; }
.modal-body p { margin: 8px 0; }
.modal-body ul, .modal-body ol { padding-left: 20px; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in {
  animation: fadeInUp 0.35s ease both;
}
</style>
</head>
<body>
<div class="header">
  <h1>对比分析 · 四步精读</h1>
  <p class="subtitle">选择多篇文献，按步骤横向对比各子问题的回答，支持 AI 综述生成</p>
</div>
<div class="main">
  <div class="paper-section">
    <div class="section-label">选择文献</div>
    <div class="paper-scroll" id="paperScroll">
      <div class="loading-state"><span class="spinner"></span>加载中...</div>
    </div>
  </div>
  <div class="step-nav" id="stepNav"></div>
  <div class="action-bar" id="actionBar">
    <span class="step-name" id="currentStepName">全部步骤</span>
    <span class="count-badge" id="selectionBadge">已选 0 个问题</span>
    <span style="font-size:13px;color:var(--text-tertiary);" id="paperCountHint"></span>
    <span class="spacer"></span>
    <button class="btn-secondary" id="btnSelectAll" disabled>当前步骤全选</button>
    <button class="btn-secondary" id="btnClearAll" disabled>清空选择</button>
    <button class="btn-primary" id="btnSynthesis" disabled>生成 AI 综述</button>
  </div>
  <div id="accordionContainer"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>AI 文献综述</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="loading-state" id="synthesisLoading"><span class="spinner"></span>正在生成文献综述，请稍候...</div>
    </div>
  </div>
</div>

<script>
(function() {
  var API_URL = 'http://localhost:8001/api/compare-demo/qual';
  var STEP_NAMES = ['第一步：背景与问题', '第二步：理论视角', '第三步：逻辑与证据', '第四步：价值与启示'];
  var STEP_KEYS = ['第一步：背景与问题', '第二步：理论视角', '第三步：逻辑与证据', '第四步：价值与启示'];

  var rawData = null;
  var selectedPapers = new Set();
  var selectedSubQs = new Set();
  var currentStep = '全部';
  var openAccordions = new Set();

  marked.setOptions({ breaks: true, gfm: true });

  function init() {
    load();
    document.getElementById('btnSelectAll').addEventListener('click', selectAllVisible);
    document.getElementById('btnClearAll').addEventListener('click', clearAllSelections);
    document.getElementById('btnSynthesis').addEventListener('click', handleSynthesis);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });
  }

  function load() {
    fetch(API_URL).then(function(r) { return r.json(); }).then(function(data) {
      rawData = data;
      renderPaperCards();
      renderStepNav();
      renderAccordion();
      updateActionBar();
    }).catch(function(err) {
      document.getElementById('paperScroll').innerHTML = '<div class="error-state">加载失败：' + err.message + '</div>';
    });
  }

  function renderPaperCards() {
    var container = document.getElementById('paperScroll');
    if (!rawData || !rawData.papers || rawData.papers.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>暂无论文数据</p></div>';
      return;
    }
    container.innerHTML = '';
    rawData.papers.forEach(function(paper, idx) {
      var card = document.createElement('div');
      card.className = 'paper-card animate-in';
      card.style.animationDelay = (idx * 0.06) + 's';
      card.setAttribute('data-paper-id', paper.id);
      var authorsStr = paper.authors && paper.authors.length > 0 ? paper.authors.slice(0, 3).join(', ') + (paper.authors.length > 3 ? ' 等' : '') : '';
      var metaParts = [];
      if (authorsStr) metaParts.push(authorsStr);
      if (paper.year) metaParts.push(paper.year);
      card.innerHTML = '<div class="paper-title">' + escHtml(paper.title || '无标题') + '</div>' +
        (metaParts.length > 0 ? '<div class="paper-meta">' + escHtml(metaParts.join(' · ')) + '</div>' : '');
      card.addEventListener('click', function() { togglePaper(paper.id); });
      container.appendChild(card);
    });
  }

  function togglePaper(paperId) {
    if (selectedPapers.has(paperId)) selectedPapers.delete(paperId);
    else selectedPapers.add(paperId);
    refreshPaperCardStates();
    updateActionBar();
  }

  function refreshPaperCardStates() {
    document.querySelectorAll('.paper-card').forEach(function(card) {
      var id = card.getAttribute('data-paper-id');
      if (selectedPapers.has(id)) card.classList.add('selected');
      else card.classList.remove('selected');
    });
  }

  function renderStepNav() {
    var nav = document.getElementById('stepNav');
    nav.innerHTML = '';
    var allSteps = ['全部'].concat(STEP_KEYS);
    allSteps.forEach(function(name) {
      var pill = document.createElement('button');
      pill.className = 'step-pill' + (name === currentStep ? ' active' : '');
      pill.textContent = name;
      pill.addEventListener('click', function() {
        currentStep = name;
        document.querySelectorAll('.step-pill').forEach(function(p) { p.classList.remove('active'); });
        pill.classList.add('active');
        renderAccordion();
        updateActionBar();
      });
      nav.appendChild(pill);
    });
  }

  function getStepsToRender() {
    if (!rawData || !rawData.papers) return [];
    if (currentStep === '全部') return STEP_KEYS.slice();
    return [currentStep];
  }

  function getAllSubQuestionsForStep(stepName) {
    var papers = getSelectedPapers();
    var seen = {};
    var result = [];
    papers.forEach(function(paper) {
      var step = paper.steps && paper.steps[stepName];
      if (!step || !step.subQuestions) return;
      step.subQuestions.forEach(function(sq) {
        if (!seen[sq.id]) {
          seen[sq.id] = true;
          result.push(sq);
        }
      });
    });
    return result;
  }

  function getSelectedPapers() {
    if (!rawData || !rawData.papers) return [];
    return rawData.papers.filter(function(p) { return selectedPapers.has(p.id); });
  }

  function renderAccordion() {
    var container = document.getElementById('accordionContainer');
    container.innerHTML = '';
    var steps = getStepsToRender();
    var hasContent = false;

    steps.forEach(function(stepName, stepIdx) {
      var subqs = getAllSubQuestionsForStep(stepName);
      if (subqs.length === 0) return;
      hasContent = true;

      subqs.forEach(function(sq, sqIdx) {
        var item = document.createElement('div');
        item.className = 'accordion-item animate-in';
        item.style.animationDelay = ((stepIdx * subqs.length + sqIdx) * 0.04) + 's';

        var isOpen = openAccordions.has(sq.id);
        if (isOpen) item.classList.add('open');

        var header = document.createElement('div');
        header.className = 'accordion-header';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = selectedSubQs.has(sq.id);
        cb.addEventListener('change', function(e) {
          e.stopPropagation();
          if (cb.checked) selectedSubQs.add(sq.id);
          else selectedSubQs.delete(sq.id);
          updateActionBar();
        });

        var label = document.createElement('span');
        label.className = 'subq-label';
        label.textContent = sq.label || sq.id;

        var tag = null;
        if (currentStep === '全部') {
          tag = document.createElement('span');
          tag.className = 'step-tag';
          tag.textContent = stepName.replace('第', '').replace('步', '').replace('：', '·');
        }

        var arrow = document.createElement('span');
        arrow.className = 'accordion-arrow';
        arrow.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        header.appendChild(cb);
        header.appendChild(label);
        if (tag) header.appendChild(tag);
        header.appendChild(arrow);

        header.addEventListener('click', function(e) {
          if (e.target === cb) return;
          if (openAccordions.has(sq.id)) openAccordions.delete(sq.id);
          else openAccordions.add(sq.id);
          item.classList.toggle('open');
        });

        var body = document.createElement('div');
        body.className = 'accordion-body';

        var scroll = document.createElement('div');
        scroll.className = 'answer-scroll';

        var papers = getSelectedPapers();
        var foundAny = false;
        papers.forEach(function(paper) {
          var step = paper.steps && paper.steps[stepName];
          if (!step || !step.subQuestions) return;
          var matched = null;
          step.subQuestions.forEach(function(s) {
            if (s.id === sq.id) matched = s;
          });
          if (!matched) return;
          foundAny = true;

          var answerCard = document.createElement('div');
          answerCard.className = 'answer-card';

          var cardHeader = document.createElement('div');
          cardHeader.className = 'answer-card-header';
          var authorsStr = paper.authors && paper.authors.length > 0 ? paper.authors.slice(0, 2).join(', ') + (paper.authors.length > 2 ? ' 等' : '') : '';
          cardHeader.innerHTML = '<div class="card-paper-title">' + escHtml(paper.title || '无标题') + '</div>' +
            (authorsStr || paper.year ? '<div class="card-paper-meta">' + escHtml([authorsStr, paper.year].filter(Boolean).join(' · ')) + '</div>' : '');

          var cardBody = document.createElement('div');
          cardBody.className = 'answer-card-body';

          if (matched.content && matched.content.trim()) {
            var rendered = marked.parse(matched.content);
            cardBody.innerHTML = wrapTables(rendered);
            setTimeout(function() {
              renderMathInElement(cardBody, {
                delimiters: [
                  { left: '$$', right: '$$', display: true },
                  { left: '$', right: '$', display: false },
                  { left: '\\(', right: '\\)', display: false },
                  { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
              });
            }, 0);
          } else {
            cardBody.innerHTML = '<div class="answer-empty">（未回答）</div>';
          }

          answerCard.appendChild(cardHeader);
          answerCard.appendChild(cardBody);
          scroll.appendChild(answerCard);
        });

        if (!foundAny && papers.length > 0) {
          scroll.innerHTML = '<div class="answer-empty">所选文献中暂无此问题的回答</div>';
        } else if (papers.length === 0) {
          scroll.innerHTML = '<div class="answer-empty">请先在上方选择文献</div>';
        }

        body.appendChild(scroll);
        item.appendChild(header);
        item.appendChild(body);
        container.appendChild(item);
      });
    });

    if (!hasContent) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div class="empty-icon">📋</div><p>请选择步骤和文献开始对比</p>';
      container.appendChild(empty);
    }
  }

  function selectAllVisible() {
    var steps = getStepsToRender();
    steps.forEach(function(stepName) {
      var subqs = getAllSubQuestionsForStep(stepName);
      subqs.forEach(function(sq) { selectedSubQs.add(sq.id); });
    });
    renderAccordion();
    updateActionBar();
  }

  function clearAllSelections() {
    selectedSubQs.clear();
    renderAccordion();
    updateActionBar();
  }

  function updateActionBar() {
    var stepLabel = currentStep === '全部' ? '全部步骤' : currentStep;
    document.getElementById('currentStepName').textContent = stepLabel;
    document.getElementById('selectionBadge').textContent = '已选 ' + selectedSubQs.size + ' 个问题';
    var paperHint = '已选 ' + selectedPapers.size + ' 篇文献';
    if (selectedPapers.size < 2) paperHint += '（综述至少需要 2 篇）';
    document.getElementById('paperCountHint').textContent = paperHint;
    document.getElementById('btnSelectAll').disabled = selectedPapers.size === 0;
    document.getElementById('btnClearAll').disabled = selectedSubQs.size === 0;
    document.getElementById('btnSynthesis').disabled = !(selectedPapers.size >= 2 && selectedSubQs.size >= 1);
  }

  function handleSynthesis() {
    if (selectedPapers.size < 2 || selectedSubQs.size < 1) return;
    var modal = document.getElementById('modalOverlay');
    var body = document.getElementById('modalBody');
    modal.classList.add('active');
    body.innerHTML = '<div class="loading-state"><span class="spinner"></span>正在生成文献综述，请稍候...</div>';

    var papers = getSelectedPapers();
    var dimensions = [];
    selectedSubQs.forEach(function(qId) {
      var found = null;
      STEP_KEYS.forEach(function(stepName) {
        var subqs = getAllSubQuestionsForStep(stepName);
        subqs.forEach(function(sq) {
          if (sq.id === qId) found = { label: sq.label, step: stepName };
        });
      });
      if (found) dimensions.push(found);
    });

    var paperData = papers.map(function(paper) {
      var selectedContent = {};
      selectedSubQs.forEach(function(qId) {
        STEP_KEYS.forEach(function(stepName) {
          var step = paper.steps && paper.steps[stepName];
          if (!step || !step.subQuestions) return;
          step.subQuestions.forEach(function(sq) {
            if (sq.id === qId && sq.content) {
              selectedContent[sq.label] = sq.content;
            }
          });
        });
      });
      return {
        title: paper.title,
        authors: paper.authors || [],
        year: paper.year,
        journal: paper.journal || '',
        doi: paper.doi || '',
        subQuestions: selectedContent
      };
    });

    var result = '# 文献综述\n\n';
    result += '基于 ' + papers.length + ' 篇文献的对比分析。\n\n';

    dimensions.forEach(function(dim) {
      result += '## ' + dim.label + '\n\n';
      result += '**所属步骤：' + dim.step + '**\n\n';
      paperData.forEach(function(pd) {
        if (pd.subQuestions[dim.label]) {
          result += '### ' + pd.title + '\n\n';
          result += pd.subQuestions[dim.label] + '\n\n';
        }
      });
    });

    setTimeout(function() {
      body.innerHTML = marked.parse(wrapTables(result));
      renderMathInElement(body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }, 800);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function wrapTables(html) {
    return html.replace(/<table>/g, '<div class="table-wrapper"><table>').replace(/<\/table>/g, '</table></div>');
  }

  function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
})();
</script>
</body>
</html>
