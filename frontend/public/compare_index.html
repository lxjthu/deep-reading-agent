<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比综述 Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-canvas:#faf8f5;--bg-surface:#ffffff;--text-primary:#2d2a26;
  --text-secondary:#5c554d;--text-tertiary:#9a9188;--accent-primary:#166534;
  --accent-primary-hover:#14532d;--border-light:#ebe7e0;--border-medium:#ddd8cf;
  --shadow-sm:0 1px 3px rgba(45,42,38,0.05);--shadow-md:0 4px 12px rgba(45,42,38,0.08);
  --radius-lg:12px;--radius-xl:16px;
}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg-canvas);color:var(--text-primary);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;
}
.container{max-width:800px;width:100%;text-align:center}
h1{
  font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;
  letter-spacing:1px;margin-bottom:12px;color:var(--text-primary);
}
.subtitle{font-size:16px;color:var(--text-secondary);line-height:1.7;margin-bottom:48px}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.card{
  background:var(--bg-surface);border:1px solid var(--border-light);
  border-radius:var(--radius-xl);padding:32px 28px;min-width:220px;max-width:260px;
  flex:1;text-align:left;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:all .25s ease;
  text-decoration:none;color:inherit;display:block;
}
.card:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-md);
  border-color:var(--accent-primary);
}
.card-icon{
  width:48px;height:48px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;margin-bottom:16px;
  background:rgba(22,101,52,0.06);color:var(--accent-primary);
}
.card h3{
  font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;
  margin-bottom:8px;
}
.card p{font-size:13px;color:var(--text-tertiary);line-height:1.6}
.badge{
  display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;
  background:rgba(22,101,52,0.08);color:var(--accent-primary);font-weight:600;
  margin-top:12px;
}
.footer{margin-top:48px;font-size:13px;color:var(--text-tertiary)}
.footer code{background:var(--border-light);padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <h1>对比综述 Demo</h1>
  <p class="subtitle">学术论文在线精读工作台 — 文献对比分析演示</p>
  <div class="cards">
    <a class="card" href="/compare_long.html">
      <div class="card-icon">📖</div>
      <h3>长文本精读</h3>
      <p>跨维度深度对比，涵盖研究问题、理论框架、识别策略等分析维度</p>
      <span class="badge">3 篇文献</span>
    </a>
    <a class="card" href="/compare_4step.html">
      <div class="card-icon">🔬</div>
      <h3>四步精读</h3>
      <p>背景与问题、理论视角、逻辑与证据、价值与启示四步对比</p>
      <span class="badge">2 篇文献</span>
    </a>
    <a class="card" href="/compare_7step.html">
      <div class="card-icon">📊</div>
      <h3>七步精读</h3>
      <p>从核心贡献到未来方向的七步系统性定量分析对比</p>
      <span class="badge">3 篇文献</span>
    </a>
  </div>
  <p class="footer">启动命令：<code>python backend/compare_demo_server.py</code> — 端口 8001</p>
</div>
</body>
</html>
